[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sv-investigator"
version = "0.4.0"
description = "A bounded multi-agent workflow for investigating candidate structural variants."
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.0,<3.0",
  "pydantic>=2.7,<3.0",
]

[tool.setuptools]
packages = ["sv_investigator"]
package-dir = {sv_investigator = "."}
