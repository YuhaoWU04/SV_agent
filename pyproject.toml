[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sv-investigator"
version = "1.2.0"
description = "A bounded multi-agent workflow for investigating candidate structural variants."
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.0,<3.0",
  "numpy>=1.26,<3.0",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "scikit-allel>=1.3,<2.0",
]

[project.optional-dependencies]
local = ["litellm>=1.84,<2.0"]

[project.scripts]
sv-fst-screen = "sv_investigator.population_fst:main"
sv-runner = "sv_investigator.runner:main"

[tool.setuptools]
packages = ["sv_investigator"]
package-dir = {sv_investigator = "."}
