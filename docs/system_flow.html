<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SV Investigator：确定性基线与受约束自适应调查</title>
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f4f6f8, #0e1116);
  --panel: light-dark(#ffffff, #171c24);
  --panel-2: light-dark(#f8fafc, #202733);
  --text: light-dark(#17202a, #edf2f7);
  --muted: light-dark(#617080, #a8b3c2);
  --border: light-dark(#cfd7e1, #3b4655);
  --primary: light-dark(#235ea7, #79b8ff);
  --field: light-dark(#e9f2ff, #18314e);
  --det: light-dark(#e7f6ed, #173d2a);
  --model: light-dark(#fff3d6, #4a3512);
  --external: light-dark(#f1eafe, #342555);
  --schema: light-dark(#feecee, #4b2028);
  --danger: light-dark(#b42318, #ff8a80);
  --shadow: light-dark(rgba(20, 35, 55, .14), rgba(0, 0, 0, .35));
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
button, input { font: inherit; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.toolbar { z-index: 30; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border); box-shadow: 0 2px 12px var(--shadow); }
.title-block { min-width: 270px; margin-right: auto; }
.title-block h1 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
.title-block p { margin: 0; color: var(--muted); font-size: 12px; }
.control { border: 1px solid var(--border); color: var(--text); background: var(--panel-2); border-radius: 7px; min-height: 36px; padding: 7px 10px; }
button.control { cursor: pointer; }
button.control:hover { border-color: var(--primary); }
.search { width: min(320px, 42vw); }
.toggle { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
.workspace { position: relative; overflow: hidden; touch-action: none; cursor: grab; }
.workspace.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; padding: 92px 70px 120px; display: flex; gap: 105px; align-items: flex-start; }
.edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 4; }
.stage { position: relative; z-index: 3; width: 410px; flex: 0 0 410px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px var(--shadow); overflow: hidden; }
.stage-header { padding: 15px 17px; border-bottom: 1px solid var(--border); background: var(--panel-2); }
.stage-index { color: var(--primary); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
.stage h2 { margin: 3px 0 2px; font-size: 19px; font-weight: 600; }
.stage-subtitle { color: var(--muted); font-size: 12px; }
.stage-summary { padding: 12px 17px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--border); }
.section { padding: 11px 12px 14px; }
.section + .section { border-top: 1px solid var(--border); }
.section h3 { margin: 0 4px 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.node { width: 100%; text-align: left; border: 1px solid transparent; border-radius: 8px; color: var(--text); padding: 9px 10px; margin: 6px 0; cursor: pointer; transition: opacity .14s, border-color .14s, transform .14s; }
.node:hover, .node:focus-visible { border-color: var(--primary); outline: none; transform: translateY(-1px); }
.field-node { background: var(--field); }
.transform-node { background: var(--det); }
.transform-node[data-kind="model-controlled"], .transform-node[data-kind="model-structured"] { background: var(--model); }
.transform-node[data-kind="external-query"] { background: var(--external); }
.transform-node[data-kind="schema-validation"] { background: var(--schema); }
.node-path { display: block; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
.node-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
.node.dim { opacity: .16; }
.node.related { border-color: var(--primary); }
.node.selected { border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 30%, transparent); }
.stage-limit { margin: 0; padding: 11px 16px 14px; color: var(--muted); font-size: 12px; border-top: 1px dashed var(--border); }
.edge { fill: none; stroke: var(--border); stroke-width: 1.2; opacity: .12; }
.edge.active { stroke: var(--primary); stroke-width: 2.2; opacity: .88; }
.edge.external.active { stroke: light-dark(#6b45b5, #b39cff); }
.edge.model.active { stroke: light-dark(#a56500, #ffc766); }
.detail { position: absolute; z-index: 25; top: 14px; right: 14px; width: min(390px, calc(100% - 28px)); max-height: calc(100% - 28px); overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 32px var(--shadow); padding: 16px; }
.detail[hidden] { display: none; }
.detail h2 { margin: 0 34px 4px 0; font-size: 17px; }
.detail .path { color: var(--primary); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
.detail dl { margin: 14px 0 0; }
.detail dt { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; margin-top: 12px; }
.detail dd { margin: 4px 0 0; font-size: 13px; line-height: 1.55; }
.detail ul { margin: 5px 0 0; padding-left: 18px; }
.close { position: absolute; right: 10px; top: 10px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 20px; }
.legend { position: absolute; z-index: 20; left: 14px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; max-width: calc(100% - 28px); padding: 9px 12px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--border); border-radius: 8px; font-size: 11px; color: var(--muted); }
.key { display: inline-flex; align-items: center; gap: 5px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--border); }
.swatch.field { background: var(--field); }.swatch.det { background: var(--det); }.swatch.model { background: var(--model); }.swatch.external { background: var(--external); }.swatch.schema { background: var(--schema); }
.empty { color: var(--muted); padding: 8px; font-size: 12px; }
@media (max-width: 720px) {
  .title-block { width: 100%; }
  .search { width: 100%; }
  .stage { width: 350px; flex-basis: 350px; }
  .world { gap: 75px; padding-left: 35px; }
  .legend { display: none; }
}
</style>
</head>
<body>
<main class="app">
  <header class="toolbar">
    <div class="title-block">
      <h1>SV Investigator：确定性基线与受约束自适应调查</h1>
      <p>点击节点查看直接处理关系；可切换完整上下游。拖动画布，滚轮缩放。</p>
    </div>
    <input id="search" class="control search" type="search" aria-label="搜索字段或处理" placeholder="搜索字段、含义、数据库或规则">
    <button id="zoomOut" class="control" type="button" aria-label="缩小">−</button>
    <button id="zoomIn" class="control" type="button" aria-label="放大">＋</button>
    <button id="fit" class="control" type="button">适合窗口</button>
    <button id="reset" class="control" type="button">清除选择</button>
    <label class="toggle"><input id="traceAll" type="checkbox">追踪完整上下游</label>
    <label class="toggle"><input id="showAll" type="checkbox">显示全部字段连线</label>
  </header>
  <section id="workspace" class="workspace" aria-label="SV Investigator 字段级流程图">
    <div id="world" class="world">
      <svg id="edges" class="edges" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"></path></marker></defs></svg>
    </div>
    <aside id="detail" class="detail" aria-live="polite" hidden><button id="closeDetail" class="close" type="button" aria-label="关闭详情">×</button><div id="detailBody"></div></aside>
    <div class="legend" aria-label="图例">
      <span class="key"><span class="swatch field"></span>字段</span>
      <span class="key"><span class="swatch det"></span>固定规则</span>
      <span class="key"><span class="swatch model"></span>模型整理</span>
      <span class="key"><span class="swatch external"></span>外部查询</span>
      <span class="key"><span class="swatch schema"></span>Schema 验证</span>
      <span class="key">源指纹 197f244f3450</span>
    </div>
  </section>
</main>
<script id="lineage-data" type="application/json">{"metadata":{"title":"SV Investigator：确定性基线与受约束自适应调查","version":"1.0.1","coordinate_system":"1-based-inclusive","description":"字段级可追踪架构；点击字段或处理节点查看输入、规则、输出与边界。"},"stages":[{"id":"input","order":0,"title":"用户输入","subtitle":"一个候选 SV","state_key":"user_message","behavior":"接收坐标、参考基因组、SVTYPE、断点不确定性、统计和质量信息。","source":"README.md / tools.py:normalize_sv_input","limitations":"必须明确 build、chrom、start、end、sv_type；坐标固定为 1-based inclusive。"},{"id":"normalize","order":1,"title":"确定性标准化","subtitle":"InputNormalizerAgent + normalize_sv_input","state_key":"normalized_sv","behavior":"统一 build、染色体与 SVTYPE，验证坐标，解析 CI 和 BND mate；工具直接把完整结果写入状态。","source":"prompts.py:INTAKE / state_pipeline.py:normalize_and_store","limitations":"不做 liftover，不接受 alternate contig，不推断缺失核心字段。"},{"id":"baseline","order":2,"title":"不可跳过的证据基线","subtitle":"BaselineEvidenceCollectorAgent + collect_baseline_evidence","state_key":"baseline_evidence","behavior":"一次固定调用并发收集 Ensembl overlap/VEP、gnomAD-SV、ClinGen Dosage、ClinVar、dbVar、DGV Gold 和技术风险；工具直接保存带证据 ID 的完整结果。","source":"prompts.py:BASELINE / state_pipeline.py:baseline_and_store","limitations":"VEP 是预测；dbVar 是异质提交记录；DGV 使用 UCSC 的 dgvGold 子集而非 DGV 完整当前发布；查询失败不等于无记录。"},{"id":"adaptive","order":3,"title":"受约束的自适应调查","subtitle":"AdaptiveInvestigationAgent + adaptive_followup_query","state_key":"adaptive_investigation","behavior":"LLM 只选择 0–2 个后续动作并记录决策审计；工具原始结果另存 adaptive_tool_results，后续 synthesis 不依赖其生物学复述。","source":"prompts.py:ADAPTIVE / state_pipeline.py:adaptive_and_store","limitations":"硬上限 2；不能改候选字段或匹配阈值；未实现完整当前 DGV、OMIM、表型本体或 enhancer-gene 查询。"},{"id":"literature","order":4,"title":"自适应文献检索","subtitle":"LiteratureAgent + search_pubmed","state_key":"literature_evidence","behavior":"LLM 只选择 PubMed 查询并返回简短审计；坐标查询必须保留精确位点和 SVTYPE，不得放宽成染色体区带或综合征；工具硬限最多 3 个查询、每次默认 5 篇、跨查询去重 PMID。","source":"prompts.py:LITERATURE / state_pipeline.py:literature_and_store","limitations":"只返回元数据和前三位作者姓名及总人数；标题不能证明机制或因果。"},{"id":"synthesis","order":5,"title":"证据综合","subtitle":"deterministic evidence view + EvidenceSynthesisAgent","state_key":"claim_synthesis","behavior":"程序先将工具证据按 ID 确定性索引，模型再总结现有证据能说明什么并产生原子候选 claim。","source":"agent.py:prepare_evidence_view / state_pipeline.py:build_evidence_view / prompts.py:SYNTHESIS / schemas.py:SynthesisOutput","limitations":"该阶段只提出候选 claim，不做最终支持度裁决。"},{"id":"verify","order":6,"title":"证据核验","subtitle":"EvidenceVerifierAgent + deterministic binding","state_key":"verification","behavior":"模型逐条裁决 claim；程序再按 claim_id 绑定回 synthesis 原文和证据，并将假设、仅有 PubMed 元数据支持的实体结论、以及非精确记录支持的同一性断言保守降为 partially_supported。","source":"prompts.py:VERIFY / agent.py:bind_verification_to_synthesis / state_pipeline.py:reconcile_verification_from_state / schemas.py:VerificationOutput","limitations":"大多数语义支持度仍是 LLM 判断；程序只实施少量可明确形式化的保守底线。"},{"id":"report","order":7,"title":"最终报告","subtitle":"ReportAssemblyAgent + SVReport","state_key":"final_report","behavior":"无 LLM 调用；程序将精确 supported claim 放入预定分区，保留 partially_supported 及限定，从 evidence gap 生成下一步，并组装、校验最终报告。","source":"agent.py:ReportAssemblyAgent / state_pipeline.py:finalize_report_from_state / schemas.py:SVReport","limitations":"claim 支持度仍依赖 verifier；输入无效时 blocked。"}],"fields":[{"id":"raw.core","path":"input.{genome_build,chrom,start,end,sv_type}","stage":"input","type":"object","meaning":"候选身份的五个必填字段。","missing":"任一缺失即 validation_error。"},{"id":"raw.ci","path":"input.{CIPOS,CIEND,CIMATE,IMPRECISE}","stage":"input","type":"object|null","meaning":"VCF 断点不确定性及不精确标志；[0,0] 表示零宽区间，不表示缺失。","missing":"省略或设为 null；下游仅用带标签的 ±500 bp fallback 检索附近候选。"},{"id":"raw.bnd","path":"input.{ALT,mate_chrom,mate_pos,CHR2,END}","stage":"input","type":"object|null","meaning":"BND mate 坐标与方向来源。","missing":"BND 降级为 first-breakend-only。"},{"id":"raw.context","path":"input.{sv_id,length_bp,statistics,quality,source_record}","stage":"input","type":"object|null","meaning":"上游标识、长度、统计、质量和原 VCF 记录。","missing":"保留显式 warning 或空对象。"},{"id":"norm.status","path":"normalized_sv.status/error","stage":"normalize","type":"valid|validation_error","meaning":"控制后续阶段是否执行。","missing":"始终产生。"},{"id":"norm.identity","path":"normalized_sv.{sv_id,genome_build,chrom,start,end,sv_type}","stage":"normalize","type":"object","meaning":"验证并规范化后的不可变候选身份。","missing":"输入无效时不构造有效身份。"},{"id":"norm.originals","path":"normalized_sv.{genome_build_original,sv_type_original,sv_subtype,normalizations}","stage":"normalize","type":"object","meaning":"标准化前值、移动元件亚型与变更审计。","missing":"有效输入时产生。"},{"id":"norm.coordinates","path":"normalized_sv.{coordinate_system,chromosome_length_bp,length_bp}","stage":"normalize","type":"object","meaning":"1-based inclusive 约定、染色体边界和长度。","missing":"INS/BND 未给长度时 length_bp 为 null。"},{"id":"norm.ci","path":"normalized_sv.{cipos,ciend,start_confidence_interval,end_confidence_interval,breakpoint_uncertainty_status,imprecise}","stage":"normalize","type":"object","meaning":"相对 CI、裁剪后的绝对 CI 及完整度。","missing":"CI 为 null，状态为 not_provided。"},{"id":"norm.bnd","path":"normalized_sv.{bnd_mate_status,mate_chrom,mate_pos,mate_confidence_interval,local_orientation,mate_orientation}","stage":"normalize","type":"object","meaning":"解析后的 BND 第二断点和邻接方向。","missing":"无 mate 时显式 not_provided。"},{"id":"norm.context","path":"normalized_sv.{statistics,quality,source_record,warnings}","stage":"normalize","type":"object","meaning":"不解释地保留上游统计、质量和来源。","missing":"缺失项进入 warnings。"},{"id":"base.contract","path":"baseline_evidence.{collection_policy,immutable_candidate_fields}","stage":"baseline","type":"object","meaning":"声明基线不可跳过，并复制不得被自适应阶段修改的候选字段。","missing":"有效输入时产生。"},{"id":"base.region","path":"baseline_evidence.region_annotation.features","stage":"baseline","type":"gene/regulatory/repeat records|null","meaning":"名义区间的 Ensembl 空间重叠；记录带 ENS-BL ID。","missing":"空数组=成功无记录；null=查询失败。"},{"id":"base.breakpoints","path":"baseline_evidence.region_annotation.breakpoint_annotations.{start,end,mate}","stage":"baseline","type":"object","meaning":"由 VCF CI 或带标签 fallback 构造的各断点窗口及 overlap 结果。","missing":"无 BND mate 时 mate 为 null。"},{"id":"base.region_meta","path":"baseline_evidence.region_annotation.{errors,truncated,attempts,source_urls,completeness,limitations}","stage":"baseline","type":"object","meaning":"Ensembl 逐类错误、截断、尝试次数、来源与空间重叠限制。","missing":"重试耗尽仍保持 error/null，不转成 not_found。"},{"id":"base.vep_records","path":"baseline_evidence.vep_evidence.records[]","stage":"baseline","type":"VEP-BL evidence records","meaning":"VEP 转录本/调控/motif/intergenic consequence、impact、overlap、canonical/MANE 和 exon/intron 信息。","missing":"BND、方向未知 CNV 或超出区间上限时显式 not_applicable。"},{"id":"base.vep_audit","path":"baseline_evidence.vep_evidence.{input_annotations,consequence_count,records_truncated,attempts,retrieved_at,limitations}","stage":"baseline","type":"object","meaning":"VEP 输入级最严重 consequence、原始计数、截断、尝试和预测边界。","missing":"失败显式 error，不转成无 consequence。"},{"id":"base.gnomad_records","path":"baseline_evidence.database_evidence.records[]","stage":"baseline","type":"GNO-BL evidence records","meaning":"gnomAD-SV 坐标、类型、AC/AN/AF、filters、匹配类别与指标。","missing":"成功无候选时为空数组。"},{"id":"base.gnomad_query","path":"baseline_evidence.database_evidence.{dataset,query_regions,breakpoint_windows,matching_query_regions}","stage":"baseline","type":"object","meaning":"build 对应数据集、实际检索区域与固定匹配窗口。","missing":"API 失败时保留 query_errors。"},{"id":"base.gnomad_audit","path":"baseline_evidence.database_evidence.{counts,query_errors,retrieved_at,limitations}","stage":"baseline","type":"object","meaning":"筛选计数、失败、检索时间和同一事件判定限制。","missing":"始终保留状态。"},{"id":"base.clingen_records","path":"baseline_evidence.clingen_dosage_evidence.records[]","stage":"baseline","type":"CGD-BL evidence records","meaning":"ClinGen 基因/区域的 HI、TS 评分、在线报告与区间匹配指标。","missing":"成功无重叠时为空数组；不适用 SVTYPE 显式 not_applicable。"},{"id":"base.clingen_audit","path":"baseline_evidence.clingen_dosage_evidence.{dataset_created_at,counts,retrieved_at,limitations}","stage":"baseline","type":"object","meaning":"ClinGen 下载文件日期、筛选计数、检索时间与临床解释边界。","missing":"下载或解析失败显式 error。"},{"id":"base.clinvar_records","path":"baseline_evidence.clinvar_evidence.records[]","stage":"baseline","type":"CLV-BL evidence records","meaning":"ClinVar VCV、临床分类、review status、性状、提交计数、坐标及区间匹配指标。","missing":"成功无候选时为空数组。"},{"id":"base.clinvar_audit","path":"baseline_evidence.clinvar_evidence.{query_regions,search_terms,counts,query_errors,retrieved_at,limitations}","stage":"baseline","type":"object","meaning":"实际检索区间和检索式、命中/返回计数、失败与 ClinVar 解释限制。","missing":"失败与无记录严格区分。"},{"id":"base.dbvar_records","path":"baseline_evidence.dbvar_evidence.records[]","stage":"baseline","type":"DBV-BL evidence records","meaning":"dbVar 变异/研究 accession、build placement、变异类型、方法、基因、临床字段及匹配指标。","missing":"BND 显式 not_applicable；成功无候选为空数组。"},{"id":"base.dbvar_audit","path":"baseline_evidence.dbvar_evidence.{query_regions,query_terms,search_counts,query_errors,retrieved_at,limitations}","stage":"baseline","type":"object","meaning":"dbVar 有界端点检索、总命中/截断、错误以及异质研究和 remap 限制。","missing":"失败与无记录严格区分。"},{"id":"base.dgv_records","path":"baseline_evidence.dgv_evidence.records[]","stage":"baseline","type":"DGV-BL evidence records","meaning":"DGV Gold 变异类型、频率、样本/研究计数、来源摘要及区间匹配指标。","missing":"成功无候选时为空数组；BND 显式 not_applicable。"},{"id":"base.dgv_audit","path":"baseline_evidence.dgv_evidence.{dataset,backend,query_regions,counts,query_errors,retrieved_at,limitations}","stage":"baseline","type":"object","meaning":"DGV Gold/UCSC 后端、实际查询、筛选计数、失败和版本/覆盖限制。","missing":"API 失败显式 error。"},{"id":"base.risk","path":"baseline_evidence.artifact_risk.{overall_risk,risk_items}","stage":"baseline","type":"object","meaning":"call rate、caller、repeat、mappability、reads、GQ、batch 的确定性初筛。","missing":"数据不足保持 unknown。"},{"id":"adapt.gaps","path":"adaptive_investigation.identified_evidence_gaps","stage":"adaptive","type":"string[]","meaning":"LLM 从基线中识别的具体未决问题。","missing":"没有实质缺口时为空。"},{"id":"adapt.plan","path":"adaptive_investigation.planned_actions","stage":"adaptive","type":"action[]","meaning":" stage":"normalize","title":"核心解析与边界校验","kind":"deterministic","inputs":["raw.core"],"outputs":["norm.status","norm.identity","norm.coordinates"],"operation":"解析 JSON，标准化 build/chrom/SVTYPE，验证整数、顺序、正长度和染色体范围；固定 1-based inclusive。","branches":["无效输入返回 validation_error"],"source":"tools.py:normalize_sv_input"},{"id":"n.uncertainty","stage":"normalize","title":"CI 与 BND 标准化","kind":"deterministic","inputs":["raw.ci","raw.bnd","norm.identity"],"outputs":["norm.ci","norm.bnd"],"operation":"相对 CI 转绝对坐标并裁剪；解析四种 BND ALT 或显式 mate；可选无效 mate 只警告。","branches":["缺 CI 不伪造测量区间","缺 mate 保留 first-breakend-only"],"source":"tools.py:_absolute_confidence_interval/_optional_bnd_mate"},{"id":"n.preserve","stage":"normalize","title":"保留原值与上下文","kind":"deterministic","inputs":["raw.core","raw.context"],"outputs":["norm.originals","norm.context"],"operation":"记录别名映射，原样保留统计、质量和 source_record。","branches":[],"source":"tools.py:normalize_sv_input"},{"id":"b.contract","stage":"baseline","title":"固定基线调用门","kind":"deterministic","inputs":["norm.status","norm.identity","norm.ci","norm.bnd","norm.context"],"outputs":["base.contract"],"operation":"工具从状态读取标准化输入，直接保存完整基线结果；无效输入记录 blocked，模型不负责转写。","branches":["validation_error → blocked"],"source":"state_pipeline.py:baseline_and_store"},{"id":"b.ensembl","stage":"baseline","title":"Ensembl 基线 overlap","kind":"external-query","inputs":["norm.identity","norm.ci","norm.bnd"],"outputs":["base.region","base.breakpoints","base.region_meta"],"operation":"重新校验坐标后查询名义区间及 start/end/mate 窗口；每个坐标范围用一次请求合并取回 gene、regulatory、repeat，相同区间复用，瞬时错误有限重试、全局限并发；保留错误、尝试次数、截断、URL 和 ENS-BL ID。","branches":["CI 缺失使用带标签 ±500 bp fallback","重试耗尽保留 error，不当作无注释"],"source":"tools.py:query_ensembl_region"},{"id":"b.vep","stage":"baseline","title":"Ensembl VEP consequence","kind":"external-query","inputs":["norm.identity"],"outputs":["base.vep_records","base.vep_audit"],"operation":"将 build、区间、strand 和符号 DEL/DUP/INV/INS 提交给 VEP，其中点状 INS 转为 VEP 的 start=end+1 表示；按 impact、MANE、canonical 和覆盖率排序并压缩 consequence，添加 VEP-BL ID。","branches":["BND 与方向未知 CNV 返回 not_applicable","超过 SV_AGENT_MAX_VEP_INTERVAL_BP 返回 not_applicable","预测 consequence 不等于实验或临床结论"],"source":"tools.py:query_ensembl_vep"},{"id":"b.gnomad","stage":"baseline","title":"gnomAD-SV 基线与固定匹配","kind":"external-query","inputs":["norm.identity","norm.ci","norm.bnd"],"outputs":["base.gnomad_records","base.gnomad_query","base.gnomad_audit"],"operation":"重新校验已存候选坐标；按 build 选数据集，检索候选并用类型、重叠和断点规则分类；缺失 CI 时 ±500 bp 只扩展检索，不单独提升 high_similarity；添加 GNO-BL ID。","branches":["BND 有 mate 比较双端；无 mate 只比较第一端且不能确认同一事件"],"source":"tools.py:query_gnomad_sv"},{"id":"b.clingen","stage":"baseline","title":"ClinGen Dosage 基因与区域证据","kind":"external-query","inputs":["norm.identity","norm.ci"],"outputs":["base.clingen_records","base.clingen_audit"],"operation":"下载 ClinGen 当前基因与区域剂量敏感性表，按 build 解析区间并计算重叠；DEL 优先 HI、DUP 优先 TS，记录评分、报告链接、版本日期、匹配指标和 CGD-BL ID。","branches":["非 CNV 类型返回 not_applicable","空间重叠和剂量评分不能直接诊断当前个体"],"source":"tools.py:query_clingen_dosage"},{"id":"b.clinvar","stage":"baseline","title":"ClinVar 临床变异记录","kind":"external-query","inputs":["norm.identity","norm.ci","norm.bnd"],"outputs":["base.clinvar_records","base.clinvar_audit"],"operation":"使用 NCBI E-utilities 按 build、区间、SV 类型和长度检索 VCV，提取临床分类、review status、性状、提交计数与坐标，再以统一规则计算 overlap/断点指标并添加 CLV-BL ID。","branches":["大区间和返回数量均受硬限制","BND 只比较当前可检索断点，不能仅凭命中确认同一邻接事件","检索失败不当作无记录"],"source":"tools.py:query_clinvar"},{"id":"b.dbvar","stage":"baseline","title":"NCBI dbVar 结构变异记录","kind":"external-query","inputs":["norm.identity","norm.ci"],"outputs":["base.dbvar_records","base.dbvar_audit"],"operation":"以 NCBI ESearch/ESummary 按染色体、端点、类型和对象检索，筛选 build-matched placement，计算固定匹配指标并添加 DBV-BL ID。","branches":["泛 CNV 对 DEL/DUP 仅标为方向不明","BND 因无可靠 mate adjacency 返回 not_applicable","端点检索可能漏掉完全包围候选的更大记录","remap 和坐标相同不证明事件同一或已验证"],"source":"tools.py:query_dbvar"},{"id":"b.dgv","stage":"baseline","title":"DGV Gold 人群结构变异","kind":"external-query","inputs":["norm.identity","norm.ci"],"outputs":["base.dgv_records","base.dgv_audit"],"operation":"通过 UCSC API 查询 build 对应的 dgvGold track，将 0-based half-open 坐标转为 1-based inclusive，按类型与区间匹配并压缩冗长样本/来源字段，添加 DGV-BL ID。","branches":["BND 返回 not_applicable","dgvGold 不是 DGV 完整当前发布，阴性结果不能证明数据库中不存在"],"source":"tools.py:query_dgv"},{"id":"b.risk","stage":"baseline","title":"确定性技术风险","kind":"deterministic","inputs":["norm.context","base.breakpoints"],"outputs":["base.risk"],"operation":"根据质量字段和断点 repeat 判断风险；布尔伪数字或范围外 call rate 不参与数值判定。","branches":["缺失、类型错误或范围错误保持 unknown"],"source":"tools.py:assess_artifact_risk"},{"id":"a.decide","stage":"adaptive","title":"识别缺口与选择动作","kind":"model-controlled","inputs":["norm.identity","norm.ci","norm.bnd","base.region","base.vep_records","base.gnomad_records","base.clingen_records","base.clinvar_records","base.dbvar_records","base.dgv_records","base.risk"],"outputs":["adapt.gaps","adapt.plan"],"operation":"只有缺口明确、工具能减少不确定性、未重复、预算存在且可能改变解释时才计划动作；P0/P1 固定来源已在基线查询，不重复调用。","branches":["无合格动作直接停止"],"source":"prompts.py:ADAPTIVE"},{"id":"a.guard","stage":"adaptive","title":"白名单、去重与硬预算","kind":"deterministic","inputs":["adapt.plan","norm.identity"],"outputs":["adapt.audit"],"operation":"先以短锁原子预留 ToolContext state 中的名额，再执行外部请求；强制最多 2 次并直接保存每次工具返回，拒绝非白名单和重复动作。","branches":["拒绝项不执行外部查询","外部失败仍消耗已预留预算"],"source":"state_pipeline.py:adaptive_and_store / tools.py:run_budgeted_adaptive_action"},{"id":"a.ensembl","stage":"adaptive","title":"可选 Ensembl 精化","kind":"external-query","inputs":["adapt.audit","norm.identity","norm.bnd"],"outputs":["adapt.ensembl"],"operation":"按已选动作查询 10/50 kb 最近基因、transcript、exon 或 BND mate transcript；瞬时错误有限重试，保留尝试次数和 ENS-ADP ID。","branches":["BND mate action 无 mate 时 not_applicable","重试耗尽保留 error","重叠不等于 consequence"],"source":"tools.py:_ensembl_adaptive_query"},{"id":"a.gnomad","stage":"adaptive","title":"可选 gnomAD 检索扩展","kind":"external-query","inputs":["adapt.audit","base.gnomad_query","norm.identity","norm.ci"],"outputs":["adapt.gnomad"],"operation":"只将 API 检索区域扩大 2 kb 或 10 kb；分类仍使用基线固定窗口与阈值。","branches":["新取得但窗外的记录仍为 nearby"],"source":"tools.py:query_gnomad_sv(retrieval_padding_bp)"},{"id":"a.stop","stage":"adaptive","title":"停止与剩余限制","kind":"model-controlled","inputs":["adapt.gaps","adapt.plan","adapt.audit","adapt.ensembl","adapt.gnomad"],"outputs":["adapt.stop"],"operation":"说明停止原因和白名单无法覆盖的剩余问题，不把未用预算描述为失败。","branches":[],"source":"prompts.py:ADAPTIVE"},{"id":"l.search","stage":"literature","title":"证据驱动 PubMed 查询","kind":"external-query","inputs":["norm.identity","base.region","adapt.ensembl"],"outputs":["lit.queries","lit.records","lit.tool_audit","lit.audit"],"operation":"以短锁原子预留查询名额并合并去重结果；限制最多 3 个不同查询、每次默认 5 篇，压缩作者信息并保存证据 ID、计数和错误。","branches":["重复查询或超预算拒绝且不访问 API","异常响应显式 error，不伪装为无记录","失败查询仍占一个名额","不得从模型记忆补基因"],"source":"state_pipeline.py:literature_and_store / tools.py:search_pubmed"},{"id":"s.index","stage":"synthesis","title":"确定性证据投影","kind":"deterministic","inputs":["base.region","base.vep_records","base.gnomad_records","base.clingen_records","base.clinvar_records","base.dbvar_records","base.dgv_records","base.risk","adapt.audit","adapt.ensembl","adapt.gnomad","lit.records","lit.tool_audit"],"outputs":["synth.view"],"operation":"before-agent callback 遍历工具状态，将每条原记录按 evidence_id 唯一索引；原记录从 source_context 移出以避免 prompt 重复。","branches":["完整原工具结果仍保留在 session state","后三个 LLM agent 使用 include_contents=none，不重放工具历史"],"source":"agent.py:prepare_evidence_view / state_pipeline.py:build_evidence_view"},{"id":"s.claim","stage":"synthesis","title":"证据总结与原子 claim","kind":"model-structured","inputs":["norm.context","synth.view","adapt.gaps","adapt.stop","lit.audit"],"outputs":["synth.claims"],"operation":"总结现有证据能说明什么，将陈述拆为原子候选 claim 并引用索引中的 ID；不做最终支持度裁决。","branches":["事实候选 claim 无 evidence ID 时由 schema 边界丢弃并记入 limitation，不中止 workflow","不从模型记忆补充事实"],"source":"prompts.py:SYNTHESIS / schemas.py:SynthesisOutput"},{"id":"v.ground","stage":"verify","title":"候选 claim 证据核验","kind":"model-structured + deterministic guard","inputs":["synth.claims","synth.view"],"outputs":["verify.claims","verify.audit"],"operation":"模型直接查看 ID 对应原记录并裁决；程序恢复原 claim 字段，拒绝新增或改写，并对可形式化的过度结论强制保守降级。","branches":["假设不能成为 established finding","推断型良性/致病/无功能影响结论最多 partially_supported","仅 PubMed 元数据支持的实体结论最多 partially_supported","非 exact/high_similarity 记录不能支持同一性断言","VEP consequence 不能表述为已证实机制"],"source":"prompts.py:VERIFY / state_pipeline.py:reconcile_verification_from_state / schemas.py:VerificationOutput"},{"id":"p.assemble","stage":"report","title":"确定性报告组装","kind":"deterministic","inputs":["norm.identity","norm.originals","norm.coordinates","norm.ci","norm.bnd","norm.context","base.risk","adapt.audit","adapt.stop","lit.records","lit.tool_audit","verify.claims","verify.audit","synth.claims"],"outputs":["report.summary","report.sections","report.mechanical","report.catalog","report.investigation","report.status"],"operation":"ReportAssemblyAgent 直接将精确 supported claim 按 report_section 组装进正文，保留 partially_supported 及核验注释；从 evidence gap 生成下一步，并组装 SV 摘要、技术风险、查询审计、状态、限制和 evidence catalog。","branches":["无最终 LLM 调用","预算只根据 adaptive_tool_results 中的 executed 动作计数"],"source":"agent.py:ReportAssemblyAgent / state_pipeline.py:finalize_report_from_state"},{"id":"p.validate","stage":"report","title":"Pydantic 确定性验证","kind":"schema-validation","inputs":["report.summary","report.sections","report.catalog","report.investigation","report.status"],"outputs":["report.status"],"operation":"验证候选坐标、证据 ID 引用唯一性以及固定为 2 的 adaptive 预算；queries_used 必须等于真正执行的动作数，拒绝动作只保留审计。","branches":["悬空 evidence ID、越界坐标、动作计数不一致或超预算报告被拒绝"],"source":"schemas.py:SVReport"}]}</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById('lineage-data').textContent);
  const workspace = document.getElementById('workspace');
  const world = document.getElementById('world');
  const svg = document.getElementById('edges');
  const detail = document.getElementById('detail');
  const detailBody = document.getElementById('detailBody');
  const search = document.getElementById('search');
  const traceAll = document.getElementById('traceAll');
  const showAll = document.getElementById('showAll');
  const nodes = new Map();
  const fields = new Map(data.fields.map(x => [x.id, {...x, nodeType: 'field'}]));
  const transforms = new Map(data.transformations.map(x => [x.id, {...x, nodeType: 'transform'}]));
  const stages = [...data.stages].sort((a, b) => a.order - b.order);
  const stageMap = new Map(stages.map(x => [x.id, x]));
  const edges = [];
  let selected = null;
  let scale = 0.72;
  let panX = 24;
  let panY = 30;
  let dragging = false;
  let dragStart = null;

  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const nodeButton = (item, type) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = `node ${type}-node`;
    button.dataset.id = item.id;
    if (type === 'transform') button.dataset.kind = item.kind;
    const main = type === 'field' ? item.path : item.title;
    const meta = type === 'field' ? item.type : item.kind;
    button.innerHTML = `<span class="node-path">${esc(main)}</span><span class="node-meta">${esc(meta)}</span>`;
    button.addEventListener('click', event => {
      event.stopPropagation();
      selectNode(item.id);
    });
    nodes.set(item.id, button);
    return button;
  };

  for (const stage of stages) {
    const card = document.createElement('article');
    card.className = 'stage';
    card.dataset.stage = stage.id;
    card.innerHTML = `<header class="stage-header"><div class="stage-index">阶段 ${stage.order}</div><h2>${esc(stage.title)}</h2><div class="stage-subtitle">${esc(stage.subtitle)}</div></header><div class="stage-summary">${esc(stage.behavior)}</div>`;
    const fieldSection = document.createElement('section');
    fieldSection.className = 'section';
    fieldSection.innerHTML = '<h3>字段</h3>';
    const stageFields = data.fields.filter(item => item.stage === stage.id);
    if (!stageFields.length) fieldSection.insertAdjacentHTML('beforeend', '<div class="empty">无字段节点</div>');
    stageFields.forEach(item => fieldSection.appendChild(nodeButton(item, 'field')));
    card.appendChild(fieldSection);
    const transformSection = document.createElement('section');
    transformSection.className = 'section';
    transformSection.innerHTML = '<h3>处理与查询</h3>';
    const stageTransforms = data.transformations.filter(item => item.stage === stage.id);
    if (!stageTransforms.length) transformSection.insertAdjacentHTML('beforeend', '<div class="empty">外部输入，不执行处理</div>');
    stageTransforms.forEach(item => transformSection.appendChild(nodeButton(item, 'transform')));
    card.appendChild(transformSection);
    card.insertAdjacentHTML('beforeend', `<p class="stage-limit"><strong>边界：</strong>${esc(stage.limitations)}<br><strong>状态键：</strong>${esc(stage.state_key)}</p>`);
    world.appendChild(card);
  }

  for (const transform of data.transformations) {
    transform.inputs.forEach(fieldId => edges.push({from: fieldId, to: transform.id, type: transform.kind}));
    transform.outputs.forEach(fieldId => edges.push({from: transform.id, to: fieldId, type: transform.kind}));
  }

  function applyTransform() {
    world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  }

  function resizeWorld() {
    const cards = [...world.querySelectorAll('.stage')];
    const width = 140 + cards.reduce((sum, card) => sum + card.offsetWidth, 0) + Math.max(0, cards.length - 1) * 105;
    const height = 220 + Math.max(...cards.map(card => card.offsetHeight), 600);
    world.style.width = `${width}px`;
    world.style.height = `${height}px`;
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    drawEdges();
  }

  function portOf(element, side) {
    const er = element.getBoundingClientRect();
    const wr = world.getBoundingClientRect();
    const x = side === 'left' ? er.left : er.right;
    return {x: (x - wr.left) / scale, y: (er.top - wr.top + er.height / 2) / scale};
  }

  function createPath(edge, active) {
    const fromEl = nodes.get(edge.from);
    const toEl = nodes.get(edge.to);
    const fromStage = (fields.get(edge.from) || transforms.get(edge.from)).stage;
    const toStage = (fields.get(edge.to) || transforms.get(edge.to)).stage;
    const sameStage = fromStage === toStage;
    const from = portOf(fromEl, 'right');
    const to = portOf(toEl, sameStage ? 'right' : 'left');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    if (sameStage) {
      // Route internal field → operation → field links through the card gutter.
      // Nothing runs behind an opaque card or across its text.
      const lane = Math.max(from.x, to.x) + 22;
      path.setAttribute('d', `M ${from.x} ${from.y} L ${lane} ${from.y} L ${lane} ${to.y} L ${to.x} ${to.y}`);
    } else {
      const dx = Math.max(25, (to.x - from.x) * .42);
      path.setAttribute('d', `M ${from.x} ${from.y} C ${from.x + dx} ${from.y}, ${to.x - dx} ${to.y}, ${to.x} ${to.y}`);
    }
    path.setAttribute('marker-end', 'url(#arrow)');
    path.setAttribute('class', `edge${active ? ' active' : ''}${edge.type?.startsWith('model') ? ' model' : ''}${edge.type === 'external-query' ? ' external' : ''}`);
    svg.appendChild(path);
  }

  function focusedEdges() {
    if (!selected) return [];
    if (traceAll.checked) {
      const related = relatedSet(selected);
      return edges.filter(edge => related.has(edge.from) && related.has(edge.to));
    }
    if (transforms.has(selected)) {
      return edges.filter(edge => edge.from === selected || edge.to === selected);
    }
    // A field's local view includes each directly connected operation and that
    // operation's immediate input/output fields, but not the rest of the pipeline.
    const operations = new Set(edges.filter(edge => edge.from === selected || edge.to === selected)
      .map(edge => edge.from === selected ? edge.to : edge.from)
      .filter(id => transforms.has(id)));
    return edges.filter(edge => operations.has(edge.from) || operations.has(edge.to));
  }

  function updateFocus() {
    if (!selected) return;
    const related = new Set([selected]);
    for (const edge of focusedEdges()) {
      related.add(edge.from);
      related.add(edge.to);
    }
    for (const [nodeId, element] of nodes) {
      element.classList.toggle('selected', nodeId === selected);
      element.classList.toggle('related', nodeId !== selected && related.has(nodeId));
      element.classList.toggle('dim', !related.has(nodeId));
    }
    drawEdges();
  }

  function relatedSet(rootId) {
    if (!rootId) return new Set();
    const forward = new Map();
    const backward = new Map();
    for (const edge of edges) {
      if (!forward.has(edge.from)) forward.set(edge.from, []);
      if (!backward.has(edge.to)) backward.set(edge.to, []);
      forward.get(edge.from).push(edge.to);
      backward.get(edge.to).push(edge.from);
    }
    const seen = new Set([rootId]);
    const walk = (map, start) => {
      const queue = [start];
      while (queue.length) {
        const current = queue.shift();
        for (const next of map.get(current) || []) {
          if (!seen.has(next)) { seen.add(next); queue.push(next); }
        }
      }
    };
    walk(forward, rootId);
    walk(backward, rootId);
    return seen;
  }

  function drawEdges() {
    [...svg.querySelectorAll('path.edge')].forEach(path => path.remove());
    const activeEdges = new Set(focusedEdges());
    for (const edge of edges) {
      const active = activeEdges.has(edge);
      if (!showAll.checked && !active) continue;
      if (!nodes.has(edge.from) || !nodes.has(edge.to)) continue;
      createPath(edge, active);
    }
  }

  function connections(id, direction) {
    const ids = edges.filter(edge => direction === 'up' ? edge.to === id : edge.from === id).map(edge => direction === 'up' ? edge.from : edge.to);
    return ids.map(value => fields.get(value)?.path || transforms.get(value)?.title || value);
  }

  function showDetail(item) {
    const stage = stageMap.get(item.stage);
    if (item.nodeType === 'field') {
      detailBody.innerHTML = `<h2>字段</h2><div class="path">${esc(item.path)}</div><dl><dt>阶段</dt><dd>${esc(stage.title)}</dd><dt>类型</dt><dd>${esc(item.type)}</dd><dt>含义</dt><dd>${esc(item.meaning)}</dd><dt>缺失或失败时</dt><dd>${esc(item.missing)}</dd><dt>直接上游</dt><dd>${list(connections(item.id, 'up'))}</dd><dt>直接下游</dt><dd>${list(connections(item.id, 'down'))}</dd></dl>`;
    } else {
      detailBody.innerHTML = `<h2>${esc(item.title)}</h2><div class="path">${esc(item.kind)}</div><dl><dt>阶段</dt><dd>${esc(stage.title)}</dd><dt>处理</dt><dd>${esc(item.operation)}</dd><dt>输入字段</dt><dd>${list(item.inputs.map(id => fields.get(id)?.path || id))}</dd><dt>输出字段</dt><dd>${list(item.outputs.map(id => fields.get(id)?.path || id))}</dd><dt>分支与约束</dt><dd>${list(item.branches || [])}</dd><dt>实现位置</dt><dd><code>${esc(item.source)}</code></dd></dl>`;
    }
    detail.hidden = false;
  }

  function list(values) {
    if (!values.length) return '<span class="node-meta">无</span>';
    return `<ul>${values.map(value => `<li>${esc(value)}</li>`).join('')}</ul>`;
  }

  function selectNode(id) {
    selected = id;
    const item = fields.get(id) || transforms.get(id);
    if (item) showDetail(item);
    updateFocus();
  }

  function clearSelection() {
    selected = null;
    for (const element of nodes.values()) element.classList.remove('selected', 'related', 'dim');
    detail.hidden = true;
    drawEdges();
  }

  function fit() {
    const bounds = workspace.getBoundingClientRect();
    const wanted = Math.min((bounds.width - 40) / world.offsetWidth, (bounds.height - 50) / world.offsetHeight, 1);
    scale = Math.max(.18, wanted);
    panX = 20;
    panY = 20;
    applyTransform();
    drawEdges();
  }

  search.addEventListener('input', () => {
    const query = search.value.trim().toLocaleLowerCase();
    if (!query) { clearSelection(); return; }
    for (const [id, element] of nodes) {
      const item = fields.get(id) || transforms.get(id);
      const haystack = JSON.stringify(item).toLocaleLowerCase();
      const match = haystack.includes(query);
      element.classList.toggle('dim', !match);
      element.classList.toggle('related', match);
    }
    selected = null;
    detail.hidden = true;
    drawEdges();
  });
  showAll.addEventListener('change', drawEdges);
  traceAll.addEventListener('change', updateFocus);
  document.getElementById('reset').addEventListener('click', () => { search.value = ''; clearSelection(); });
  document.getElementById('closeDetail').addEventListener('click', clearSelection);
  document.getElementById('fit').addEventListener('click', fit);
  document.getElementById('zoomIn').addEventListener('click', () => { scale = Math.min(1.6, scale * 1.18); applyTransform(); drawEdges(); });
  document.getElementById('zoomOut').addEventListener('click', () => { scale = Math.max(.18, scale / 1.18); applyTransform(); drawEdges(); });
  workspace.addEventListener('wheel', event => {
    event.preventDefault();
    const rect = workspace.getBoundingClientRect();
    const mouseX = event.clientX - rect.left;
    const mouseY = event.clientY - rect.top;
    const beforeX = (mouseX - panX) / scale;
    const beforeY = (mouseY - panY) / scale;
    scale = Math.max(.18, Math.min(1.6, scale * (event.deltaY < 0 ? 1.1 : .9)));
    panX = mouseX - beforeX * scale;
    panY = mouseY - beforeY * scale;
    applyTransform();
    drawEdges();
  }, {passive: false});
  workspace.addEventListener('pointerdown', event => {
    if (event.target.closest('.node, .detail, .toolbar')) return;
    dragging = true;
    dragStart = {x: event.clientX, y: event.clientY, panX, panY};
    workspace.classList.add('dragging');
    workspace.setPointerCapture(event.pointerId);
  });
  workspace.addEventListener('pointermove', event => {
    if (!dragging) return;
    panX = dragStart.panX + event.clientX - dragStart.x;
    panY = dragStart.panY + event.clientY - dragStart.y;
    applyTransform();
  });
  workspace.addEventListener('pointerup', event => {
    dragging = false;
    workspace.classList.remove('dragging');
    if (workspace.hasPointerCapture(event.pointerId)) workspace.releasePointerCapture(event.pointerId);
  });
  window.addEventListener('resize', resizeWorld);
  applyTransform();
  requestAnimationFrame(() => { resizeWorld(); fit(); });
})();
</script>
</body>
