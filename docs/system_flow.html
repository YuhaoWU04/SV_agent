<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SV Investigator 字段级行为地图</title>
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f4f6f8, #0e1116);
  --panel: light-dark(#ffffff, #171c24);
  --panel-2: light-dark(#f8fafc, #202733);
  --text: light-dark(#17202a, #edf2f7);
  --muted: light-dark(#617080, #a8b3c2);
  --border: light-dark(#cfd7e1, #3b4655);
  --primary: light-dark(#235ea7, #79b8ff);
  --field: light-dark(#e9f2ff, #18314e);
  --det: light-dark(#e7f6ed, #173d2a);
  --model: light-dark(#fff3d6, #4a3512);
  --external: light-dark(#f1eafe, #342555);
  --schema: light-dark(#feecee, #4b2028);
  --danger: light-dark(#b42318, #ff8a80);
  --shadow: light-dark(rgba(20, 35, 55, .14), rgba(0, 0, 0, .35));
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
button, input { font: inherit; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.toolbar { z-index: 30; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border); box-shadow: 0 2px 12px var(--shadow); }
.title-block { min-width: 270px; margin-right: auto; }
.title-block h1 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
.title-block p { margin: 0; color: var(--muted); font-size: 12px; }
.control { border: 1px solid var(--border); color: var(--text); background: var(--panel-2); border-radius: 7px; min-height: 36px; padding: 7px 10px; }
button.control { cursor: pointer; }
button.control:hover { border-color: var(--primary); }
.search { width: min(320px, 42vw); }
.toggle { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
.workspace { position: relative; overflow: hidden; touch-action: none; cursor: grab; }
.workspace.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; padding: 92px 70px 120px; display: flex; gap: 105px; align-items: flex-start; }
.edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1; }
.stage { position: relative; z-index: 3; width: 410px; flex: 0 0 410px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px var(--shadow); overflow: hidden; }
.stage-header { padding: 15px 17px; border-bottom: 1px solid var(--border); background: var(--panel-2); }
.stage-index { color: var(--primary); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
.stage h2 { margin: 3px 0 2px; font-size: 19px; font-weight: 600; }
.stage-subtitle { color: var(--muted); font-size: 12px; }
.stage-summary { padding: 12px 17px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--border); }
.section { padding: 11px 12px 14px; }
.section + .section { border-top: 1px solid var(--border); }
.section h3 { margin: 0 4px 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.node { width: 100%; text-align: left; border: 1px solid transparent; border-radius: 8px; color: var(--text); padding: 9px 10px; margin: 6px 0; cursor: pointer; transition: opacity .14s, border-color .14s, transform .14s; }
.node:hover, .node:focus-visible { border-color: var(--primary); outline: none; transform: translateY(-1px); }
.field-node { background: var(--field); }
.transform-node { background: var(--det); }
.transform-node[data-kind="model-controlled"], .transform-node[data-kind="model-structured"] { background: var(--model); }
.transform-node[data-kind="external-query"] { background: var(--external); }
.transform-node[data-kind="schema-validation"] { background: var(--schema); }
.node-path { display: block; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
.node-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
.node.dim { opacity: .16; }
.node.related { border-color: var(--primary); }
.node.selected { border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 30%, transparent); }
.stage-limit { margin: 0; padding: 11px 16px 14px; color: var(--muted); font-size: 12px; border-top: 1px dashed var(--border); }
.edge { fill: none; stroke: var(--border); stroke-width: 1.4; opacity: .20; }
.edge.active { stroke: var(--primary); stroke-width: 2.2; opacity: .82; }
.edge.stage-edge { opacity: .42; stroke-width: 2; }
.edge.external.active { stroke: light-dark(#6b45b5, #b39cff); }
.edge.model.active { stroke: light-dark(#a56500, #ffc766); }
.detail { position: absolute; z-index: 25; top: 14px; right: 14px; width: min(390px, calc(100% - 28px)); max-height: calc(100% - 28px); overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 32px var(--shadow); padding: 16px; }
.detail[hidden] { display: none; }
.detail h2 { margin: 0 34px 4px 0; font-size: 17px; }
.detail .path { color: var(--primary); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
.detail dl { margin: 14px 0 0; }
.detail dt { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; margin-top: 12px; }
.detail dd { margin: 4px 0 0; font-size: 13px; line-height: 1.55; }
.detail ul { margin: 5px 0 0; padding-left: 18px; }
.close { position: absolute; right: 10px; top: 10px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 20px; }
.legend { position: absolute; z-index: 20; left: 14px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; max-width: calc(100% - 28px); padding: 9px 12px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--border); border-radius: 8px; font-size: 11px; color: var(--muted); }
.key { display: inline-flex; align-items: center; gap: 5px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--border); }
.swatch.field { background: var(--field); }.swatch.det { background: var(--det); }.swatch.model { background: var(--model); }.swatch.external { background: var(--external); }.swatch.schema { background: var(--schema); }
.empty { color: var(--muted); padding: 8px; font-size: 12px; }
@media (max-width: 720px) {
  .title-block { width: 100%; }
  .search { width: 100%; }
  .stage { width: 350px; flex-basis: 350px; }
  .world { gap: 75px; padding-left: 35px; }
  .legend { display: none; }
}
</style>
</head>
<body>
<main class="app">
  <header class="toolbar">
    <div class="title-block">
      <h1>SV Investigator 字段级行为地图</h1>
      <p>点击字段或处理节点，追踪完整上下游；拖动画布，滚轮缩放。</p>
    </div>
    <input id="search" class="control search" type="search" aria-label="搜索字段或处理" placeholder="搜索字段、含义、数据库或规则">
    <button id="zoomOut" class="control" type="button" aria-label="缩小">−</button>
    <button id="zoomIn" class="control" type="button" aria-label="放大">＋</button>
    <button id="fit" class="control" type="button">适合窗口</button>
    <button id="reset" class="control" type="button">清除选择</button>
    <label class="toggle"><input id="showAll" type="checkbox">显示全部字段连线</label>
  </header>
  <section id="workspace" class="workspace" aria-label="SV Investigator 字段级流程图">
    <div id="world" class="world">
      <svg id="edges" class="edges" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"></path></marker></defs></svg>
    </div>
    <aside id="detail" class="detail" aria-live="polite" hidden><button id="closeDetail" class="close" type="button" aria-label="关闭详情">×</button><div id="detailBody"></div></aside>
    <div class="legend" aria-label="图例">
      <span class="key"><span class="swatch field"></span>字段</span>
      <span class="key"><span class="swatch det"></span>固定规则</span>
      <span class="key"><span class="swatch model"></span>模型整理</span>
      <span class="key"><span class="swatch external"></span>外部查询</span>
      <span class="key"><span class="swatch schema"></span>Schema 验证</span>
      <span class="key">源指纹 1f9d544fd011</span>
    </div>
  </section>
</main>
<script id="lineage-data" type="application/json">{"metadata":{"version":"1.0.0","title":"SV Investigator 字段级行为地图","description":"当前 Google ADK SequentialAgent 实现的数据流、字段含义、确定性处理、模型整理和外部查询。","coordinate_system":"1-based-inclusive","maintainer_note":"修改 agent、prompt、tool 或 schema 后，更新本文件并重新运行生成器。"},"stages":[{"id":"input","order":0,"title":"用户输入","subtitle":"一个候选结构变异 JSON","state_key":"user_message","behavior":"接收候选 SV、统计量、质量信息和可选 VCF 字段。","source":"example_input.json","limitations":"一次只调查一个候选 SV。"},{"id":"normalize","order":1,"title":"输入标准化","subtitle":"InputNormalizerAgent + normalize_sv_input","state_key":"normalized_sv","behavior":"验证输入，统一参考基因组、染色体、SVTYPE 和断点表达，并保留审计信息。","source":"agent.py / prompts.py / tools.py","limitations":"只接受 GRCh37/38 主染色体；不做 liftover，也不推断缺失坐标。"},{"id":"region","order":2,"title":"区域注释","subtitle":"RegionAnnotationAgent + Ensembl","state_key":"region_annotation","behavior":"查询完整区间、断点窗口和 BND mate 附近的 gene、regulatory、repeat 重叠。","source":"prompts.py / tools.py:query_ensembl_region","limitations":"仅为空间重叠，不是 VEP 后果、剂量效应、致病性或因果解释。"},{"id":"database","order":3,"title":"人群数据库","subtitle":"DatabaseEvidenceAgent + gnomAD-SV","state_key":"database_evidence","behavior":"查询 build-matched gnomAD-SV，过滤 SVTYPE，并用确定性规则分类候选相似度。","source":"prompts.py / tools.py:query_gnomad_sv","limitations":"不查询 ClinVar；未命中不代表新颖、致病或技术可靠。"},{"id":"literature","order":4,"title":"文献检索","subtitle":"LiteratureAndFunctionAgent + PubMed","state_key":"literature_evidence","behavior":"根据精确区域、SVTYPE 和 Ensembl 实际返回的基因构造至多三个 PubMed 查询。","source":"prompts.py / tools.py:search_pubmed","limitations":"只返回元数据；标题本身不能证明机制或因果。"},{"id":"artifact","order":5,"title":"技术风险","subtitle":"ArtifactRiskAgent + assess_artifact_risk","state_key":"artifact_risk","behavior":"根据质量字段和断点 repeat 注释执行第一轮确定性风险检查。","source":"prompts.py / tools.py:assess_artifact_risk","limitations":"缺失信息保持 unknown；mappability 等轨道尚未接入。"},{"id":"verify","order":6,"title":"证据核验","subtitle":"EvidenceVerifierAgent","state_key":"verification","behavior":"把候选陈述拆成原子 claim，核验 evidence ID，拒绝无证据事实并记录矛盾。","source":"prompts.py / schemas.py:VerificationOutput","limitations":"这是模型判断，但受到结构化 schema 和证据 ID 约束。"},{"id":"report","order":7,"title":"最终报告","subtitle":"ReportWriterAgent + SVReport","state_key":"final_report","behavior":"只使用前序状态和已核验证据，生成带 evidence catalog 与 provenance 的结构化报告。","source":"prompts.py / schemas.py:SVReport","limitations":"重要数据缺失时必须标记 incomplete；输入无效时必须 blocked。"}],"fields":[{"id":"raw.build","path":"input.genome_build","stage":"input","type":"string","meaning":"用户声明的参考基因组名称，可使用 hg19、hg38、GRCh37/38 等别名。","missing":"必填；缺失时 validation_error。"},{"id":"raw.chrom","path":"input.chrom","stage":"input","type":"string","meaning":"候选 SV 的第一染色体。","missing":"必填。"},{"id":"raw.start","path":"input.start","stage":"input","type":"integer|string integer","meaning":"1-based inclusive 起点；BND 时是本地 breakend。","missing":"必填。"},{"id":"raw.end","path":"input.end","stage":"input","type":"integer|string integer","meaning":"1-based inclusive 终点；传统 BND 输入仍保留该字段。","missing":"必填。"},{"id":"raw.type","path":"input.sv_type","stage":"input","type":"string","meaning":"SV 类型或别名，例如 DEL、deletion、ALU、translocation。","missing":"必填。"},{"id":"raw.id","path":"input.sv_id","stage":"input","type":"string|null","meaning":"用户提供的候选 SV 标识。","missing":"缺失时按 chrom:start-end:type 生成。"},{"id":"raw.length","path":"input.length_bp / input.svlen","stage":"input","type":"integer|null","meaning":"可选 SV 长度；SVLEN 允许负号并取绝对值。","missing":"非 INS/BND 可由坐标跨度确定。"},{"id":"raw.cipos","path":"input.CIPOS","stage":"input","type":"[integer, integer]|string|null","meaning":"相对 start 的断点置信区间偏移。","missing":"下游改用带标记的启发式窗口。"},{"id":"raw.ciend","path":"input.CIEND","stage":"input","type":"[integer, integer]|string|null","meaning":"相对 end 的断点置信区间偏移；BND 可作为 mate CI。","missing":"下游改用带标记的启发式窗口。"},{"id":"raw.imprecise","path":"input.IMPRECISE","stage":"input","type":"flag|null","meaning":"VCF 不精确断点标志。","missing":"按 false 保存。"},{"id":"raw.alt","path":"input.ALT","stage":"input","type":"string|null","meaning":"VCF ALT；标准方括号 BND 表达可携带 mate 坐标和邻接方向。","missing":"BND 可使用显式 mate 字段或降级。"},{"id":"raw.mate","path":"input.mate_chrom/mate_pos | chrom2/pos2 | CHR2/END","stage":"input","type":"string+integer|null","meaning":"BND 第二断点的显式坐标。","missing":"BND 降级为 first-breakend-only。"},{"id":"raw.cimate","path":"input.CIMATE","stage":"input","type":"[integer, integer]|null","meaning":"相对 BND mate_pos 的置信区间偏移。","missing":"若存在 mate，回退使用 CIEND。"},{"id":"raw.statistics","path":"input.statistics","stage":"input","type":"object|null","meaning":"FST、病例/对照频率等上游统计信号，原样保留。","missing":"记录 statistics_not_provided。"},{"id":"raw.quality","path":"input.quality","stage":"input","type":"object|null","meaning":"call_rate、caller、supporting_reads、genotype_quality、batch_checked 等质量信息。","missing":"记录 quality_not_provided，风险项保持 unknown。"},{"id":"norm.status","path":"normalized_sv.status","stage":"normalize","type":"valid|validation_error","meaning":"标准化是否成功；控制所有后续阶段是否执行。","missing":"始终产生。"},{"id":"norm.error","path":"normalized_sv.error","stage":"normalize","type":"string|null","meaning":"验证失败原因。","missing":"有效输入时不存在。"},{"id":"norm.id","path":"normalized_sv.sv_id","stage":"normalize","type":"string","meaning":"保留或自动生成的候选 SV 标识。","missing":"自动生成。"},{"id":"norm.build","path":"normalized_sv.genome_build","stage":"normalize","type":"GRCh37|GRCh38","meaning":"规范化后的参考基因组。","missing":"无有效值时整个输入失败。"},{"id":"norm.build_original","path":"normalized_sv.genome_build_original","stage":"normalize","type":"string","meaning":"标准化前的参考基因组名称，用于审计。","missing":"有效输入时保留。"},{"id":"norm.chrom","path":"normalized_sv.chrom","stage":"normalize","type":"1-22|X|Y|MT","meaning":"去除 chr 前缀并统一大小写后的主染色体。","missing":"无有效值时输入失败。"},{"id":"norm.start","path":"normalized_sv.start","stage":"normalize","type":"integer","meaning":"验证后的 1-based inclusive 起点。","missing":"无有效值时输入失败。"},{"id":"norm.end","path":"normalized_sv.end","stage":"normalize","type":"integer","meaning":"验证后的 1-based inclusive 终点。","missing ches":["validation_error 会使后续阶段 blocked"],"source":"tools.py:normalize_sv_input"},{"id":"n.names","stage":"normalize","title":"名称标准化","kind":"deterministic","inputs":["raw.build","raw.chrom","raw.type"],"outputs":["norm.build","norm.build_original","norm.chrom","norm.type","norm.type_original","norm.subtype","norm.audit"],"operation":"忽略 build 大小写和常见分隔符；去除 chr；映射 SVTYPE 与移动元件别名；保留原值和变更记录。","branches":[],"source":"tools.py:_normalize_genome_build/_clean_chrom/_normalize_sv_type"},{"id":"n.coordinates","stage":"normalize","title":"坐标与长度","kind":"deterministic","inputs":["raw.start","raw.end","raw.length","norm.build","norm.chrom"],"outputs":["norm.start","norm.end","norm.coord","norm.chrom_length","norm.length","norm.id"],"operation":"固定 1-based inclusive；检查染色体边界；普通区间长度=end-start+1；INS/BND 不推断长度。","branches":["提供长度与普通区间跨度不同时产生 warning"],"source":"tools.py:normalize_sv_input"},{"id":"n.ci","stage":"normalize","title":"断点置信区间","kind":"deterministic","inputs":["raw.start","raw.end","raw.cipos","raw.ciend","norm.chrom_length"],"outputs":["norm.cipos","norm.ciend","norm.start_ci","norm.end_ci","norm.uncertainty","norm.imprecise","norm.breakpoint_policy"],"operation":"解析两个相对偏移；分别加到 start/end；裁剪至染色体边界；根据提供程度标记 complete/partial/not_provided。","branches":["缺失 CI 时只声明下游启发式检索规则，不伪造测量 CI"],"source":"tools.py:_parse_confidence_offsets/_absolute_confidence_interval"},{"id":"n.bnd","stage":"normalize","title":"BND mate 与方向","kind":"deterministic","inputs":["raw.alt","raw.mate","raw.cimate","raw.ciend","norm.build","norm.type"],"outputs":["norm.mate_status","norm.mate_chrom","norm.mate_pos","norm.mate_ci","norm.orientation","norm.audit"],"operation":"优先显式 mate 坐标，也解析四种 VCF ALT 方括号格式；检查 mate 染色体边界；从 ALT 提取两个邻接方向。","branches":["可选 mate 无效时 warning 并降级，不使原本可用输入失败","无 mate 时 first-breakend-only"],"source":"tools.py:_parse_bnd_alt/_optional_bnd_mate"},{"id":"n.preserve","stage":"normalize","title":"保留上游证据","kind":"deterministic","inputs":["raw.id","raw.statistics","raw.quality","raw.imprecise"],"outputs":["norm.id","norm.statistics","norm.quality","norm.imprecise","norm.audit"],"operation":"不解释统计和质量信息，只验证对象形状并原样保留；记录缺失 warning。","branches":[],"source":"tools.py:normalize_sv_input"},{"id":"r.gate","stage":"region","title":"验证状态门","kind":"model-controlled","inputs":["norm.status"],"outputs":["region.status"],"operation":"validation_error 时返回 blocked，且不调用 Ensembl。","branches":["valid → 查询","validation_error → blocked"],"source":"prompts.py:REGION"},{"id":"r.windows","stage":"region","title":"构造注释范围","kind":"deterministic","inputs":["norm.chrom","norm.start","norm.end","norm.start_ci","norm.end_ci","norm.mate_chrom","norm.mate_pos","norm.mate_ci","norm.breakpoint_policy"],"outputs":["region.scope","region.start","region.end","region.mate"],"operation":"完整区间保持原坐标；有 CI 使用绝对 CI；没有 CI 则建立带 heuristic_fallback 标记的 ±tolerance 窗口。","branches":["BND 有 mate 时增加独立 mate 范围"],"source":"tools.py:_breakpoint_window/query_ensembl_region"},{"id":"r.query","stage":"region","title":"Ensembl overlap 查询","kind":"external-query","inputs":["norm.build","norm.type","region.scope","region.start","region.end","region.mate"],"outputs":["region.features","region.start","region.end","region.mate","region.errors","region.truncated","region.sources","region.completeness"],"operation":"GRCh37/38 选择对应 Ensembl host；每个范围并行查询 gene、regulatory、repeat；每类最多保留配置上限。","branches":["空数组=成功无记录","null=该 feature 查询失败","部分失败=partial"],"source":"tools.py:_query_ensembl_feature_set/query_ensembl_region"},{"id":"r.organize","stage":"region","title":"组织区域证据","kind":"model-controlled","inputs":["region.features","region.start","region.end","region.mate","region.errors","region.truncated","region.sources","region.completeness"],"outputs":["region.status","region.evidence","region.limitations"],"operation":"明确命名 feature，分配 ENS evidence ID，并原样保留错误、截断、来源和限制。","branches":["禁止把空间重叠写成基因破坏、剂量效应或致病性"],"source":"prompts.py:REGION"},{"id":"d.plan","stage":"database","title":"选择数据集与查询区域","kind":"deterministic","inputs":["norm.build","norm.type","norm.start","norm.end","norm.start_ci","norm.end_ci","norm.mate_chrom","norm.mate_pos","norm.mate_ci","norm.breakpoint_policy"],"outputs":["db.dataset","db.strategy","db.windows"],"operation":"GRCh38→gnomad_sv_r4；GRCh37→gnomad_sv_r2_1。≤5 Mb 查询扩展完整区间；大型 SV 查询两个断点；BND 有 mate 时查询两个染色体窗口。","branches":["BND 无 mate 保持第一断点检索"],"source":"tools.py:query_gnomad_sv"},{"id":"d.query","stage":"database","title":"gnomAD-SV GraphQL 查询","kind":"external-query","inputs":["db.dataset","db.strategy","db.windows"],"outputs":["db.record_coords","db.record_type","db.frequency","db.filters","db.errors","db.counts","db.status"],"operation":"逐区域读取结构变异坐标、类型、频率、基因型计数、consequence 和 filters；按 variant_id 去重。","branches":["API 错误不能解释为 not_found"],"source":"tools.py:GNOMAD_SV_REGION_QUERY/query_gnomad_sv"},{"id":"d.match_interval","stage":"database","title":"普通 SV/INS 候选分类","kind":"deterministic","inputs":["norm.type","norm.start","norm.end","norm.start_ci","norm.end_ci","db.record_coords","db.record_type"],"outputs":["db.match_metrics","db.match_type","db.same_event","db.counts"],"operation":"先排除不兼容 SVTYPE。DEL/DUP/INV/CNV 计算双断点距离、size similarity 和 reciprocal overlap；INS 比较插入点窗口。","branches":["只有完整所需坐标精确一致才设 same_event=true"],"source":"tools.py:_gnomad_type_compatible/_reciprocal_overlap/_classify_gnomad_candidate"},{"id":"d.match_bnd","stage":"database","title":"BND 双断点分类","kind":"deterministic","inputs":["norm.chrom","norm.start","norm.mate_chrom","norm.mate_pos","norm.start_ci","norm.mate_ci","db.record_coords","db.record_type"],"outputs":["db.match_metrics","db.match_type","db.same_event","db.counts"],"operation":"检查染色体对并允许数据库两端顺序颠倒；计算 local/mate 距离及窗口命中。gnomAD 未返回方向，所以不比较 orientation。","branches":["无 mate 时 comparison_scope=first_breakend_only，单端坐标相同也不能建立 same event"],"source":"tools.py:_classify_gnomad_candidate"},{"id":"d.organize","stage":"database","title":"组织人群证据","kind":"model-controlled","inputs":["region.evidence","db.status","db.dataset","db.strategy","db.windows","db.frequency","db.filters","db.match_type","db.match_metrics","db.same_event","db.errors","db.provenance"],"outputs":["db.evidence","db.provenance"],"operation":"调用工具一次并保留确定性匹配结果，为保留记录分配 GNO evidence ID；不得用直觉修改 match_type。","branches":["其他数据库只能列为 not_queried/tool_not_available"],"source":"prompts.py:DATABASE"},{"id":"l.plan","stage":"literature","title":"构造 PubMed 查询","kind":"model-controlled","inputs":["norm.build","norm.chrom","norm.start","norm.end","norm.type","region.features","db.evidence"],"outputs":["lit.queries"],"operation":"至多三个查询：先精确区域/SVTYPE，再使用 Ensembl 实际返回的基因；不得从模型记忆补基因。","branches":[],"source":"prompts.py:LITERATURE"},{"id":"l.query","stage":"literature","title":"PubMed E-utilities","kind":"external-query","inputs":["lit.queries"],"outputs":["lit.status","lit.records"],"operation":"ESearch 获取 PMID，再用 ESummary 获取题名、作者、期刊、日期和 DOI，最多保留配置数量。","branches":["无 PMID=not_found","网络/摘要失败=error"],"source":"tools.py:search_pubmed"},{"id":"l.organize","stage":"literature","title":"组织文献上下文","kind":"model-controlled","inputs":["lit.status","lit.records"],"outputs":["lit.evidence","lit.missing_sources","lit.limitations"],"operation":"区分 exact-SV、region、gene 和 contextual，分配 PMID evidence ID；元数据只作为上下文。","branches":["GO/Reactome/GWAS Catalog 标记 not_queried"],"source":"prompts.py:LITERATURE"},{"id":"a.quality","stage":"artifact","title":"质量字段规则","kind":"deterministic","inputs":["norm.quality"],"outputs":["risk.call_rate","risk.caller","risk.reads","risk.gq","risk.batch","risk.mappability"],"operation":"分别检查 call rate、caller 数量、reads、GQ 和 batch_checked；缺失信息保持 unknown；mappability 当前固定 unknown。","branches":[],"source":"tools.py:assess_artifact_risk"},{"id":"a.repeat","stage":"artifact","title":"断点 repeat 风险","kind":"deterministic","inputs":["region.start","region.end"],"outputs":["risk.repeat"],"operation":"合并 start/end 断点窗口的 repeat 记录；有记录=present；两次成功且均空=absent；任何关键失败=unknown。","branches":["当前不使用整个 SV 区间代替断点判断"],"source":"tools.py:assess_artifact_risk"},{"id":"a.overall","stage":"artifact","title":"汇总总体风险","kind":"deterministic","inputs":["risk.call_rate","risk.caller","risk.repeat","risk.mappability","risk.reads","risk.gq","risk.batch"],"outputs":["risk.overall"],"operation":"present≥2→high；present=1→medium；无 present 但有 unknown→unknown；全部 absent→low。","branches":[],"source":"tools.py:assess_artifact_risk"},{"id":"v.claims","stage":"verify","title":"形成原子 claims","kind":"model-structured","inputs":["norm.statistics","region.evidence","db.evidence","lit.evidence","risk.overall"],"outputs":["verify.claim"],"operation":"把候选事实和解释拆成 observation、database_fact、inference 或 hypothesis。","branches":["不得引入新的科学事实"],"source":"prompts.py:VERIFY"},{"id":"v.ground","stage":"verify","title":"证据链接与核验","kind":"model-structured","inputs":["verify.claim","region.evidence","db.evidence","lit.evidence"],"outputs":["verify.supported","verify.rejected","verify.contradictions","verify.missing","verify.allowed"],"operation":"事实 claim 必须引用现有 evidence ID；识别 build/type/match 歧义、矛盾和标题推断。","branches":["无证据事实进入 rejected_claims"],"source":"prompts.py:VERIFY / schemas.py:VerificationOutput"},{"id":"p.status","stage":"report","title":"决定报告状态","kind":"model-structured","inputs":["norm.status","verify.allowed","verify.missing","db.status","lit.status","risk.overall"],"outputs":["report.status"],"operation":"输入无效→blocked；重要来源或质量缺失→incomplete；仅在可审慎发布且必要信息充分时 complete。","branches":[],"source":"prompts.py:REPORT / schemas.py:SVReport"},{"id":"p.summary","stage":"report","title":"复制 SV 摘要","kind":"model-structured","inputs":["norm.id","norm.build","norm.build_original","norm.chrom","norm.start","norm.end","norm.coord","norm.chrom_length","norm.type","norm.type_original","norm.subtype","norm.length","norm.cipos","norm.ciend","norm.start_ci","norm.end_ci","norm.uncertainty","norm.imprecise","norm.mate_status","norm.mate_chrom","norm.mate_pos","norm.mate_ci","norm.orientation"],"outputs":["report.summary"],"operation":"把标准化核心字段复制到 SVSummary，不重新推断坐标、build、类型或 BND mate。","branches":[],"source":"prompts.py:REPORT / schemas.py:SVSummary"},{"id":"p.sections","stage":"report","title":"组织报告各节","kind":"model-structured","inputs":["norm.statistics","region.evidence","db.evidence","lit.evidence","risk.call_rate","risk.caller","risk.repeat","risk.mappability","risk.reads","risk.gq","risk.batch","verify.supported","verify.contradictions","verify.missing"],"outputs":["report.statements","report.risks","report.claims","report.caveats"],"operation":"只使用已提供状态和核验证据，按统计、区域、人群、临床、文献、功能、风险和解释组织内容。","branches":["不能恢复 rejected claim"],"source":"prompts.py:REPORT"},{"id":"p.catalog","stage":"report","title":"证据目录与来源","kind":"model-structured","inputs":["region.evidence","db.evidence","lit.evidence","region.sources","db.provenance"],"outputs":["report.catalog","report.provenance"],"operation":"复制每个被引用记录的 ID、来源、状态、URL、match type、检索时间和限制。","branches":["引用的 evidence ID 必须存在于 catalog 且 catalog ID 唯一"],"source":"schemas.py:SVReport.validate_internal_links"},{"id":"p.validate","stage":"report","title":"结构化报告验证","kind":"schema-validation","inputs":["report.status","report.summary","report.statements","report.risks","report.claims","report.catalog","report.provenance","report.caveats"],"outputs":["report.version"],"operation":"Pydantic 验证 report status、参考基因组、SVTYPE、必需坐标、证据 ID 唯一性及所有内部引用。","branches":["validation_error 输入必须对应 blocked 报告"],"source":"schemas.py:SVReport"}]}</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById('lineage-data').textContent);
  const workspace = document.getElementById('workspace');
  const world = document.getElementById('world');
  const svg = document.getElementById('edges');
  const detail = document.getElementById('detail');
  const detailBody = document.getElementById('detailBody');
  const search = document.getElementById('search');
  const showAll = document.getElementById('showAll');
  const nodes = new Map();
  const fields = new Map(data.fields.map(x => [x.id, {...x, nodeType: 'field'}]));
  const transforms = new Map(data.transformations.map(x => [x.id, {...x, nodeType: 'transform'}]));
  const stages = [...data.stages].sort((a, b) => a.order - b.order);
  const stageMap = new Map(stages.map(x => [x.id, x]));
  const edges = [];
  let selected = null;
  let scale = 0.72;
  let panX = 24;
  let panY = 30;
  let dragging = false;
  let dragStart = null;

  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const nodeButton = (item, type) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = `node ${type}-node`;
    button.dataset.id = item.id;
    if (type === 'transform') button.dataset.kind = item.kind;
    const main = type === 'field' ? item.path : item.title;
    const meta = type === 'field' ? item.type : item.kind;
    button.innerHTML = `<span class="node-path">${esc(main)}</span><span class="node-meta">${esc(meta)}</span>`;
    button.addEventListener('click', event => {
      event.stopPropagation();
      selectNode(item.id);
    });
    nodes.set(item.id, button);
    return button;
  };

  for (const stage of stages) {
    const card = document.createElement('article');
    card.className = 'stage';
    card.dataset.stage = stage.id;
    card.innerHTML = `<header class="stage-header"><div class="stage-index">阶段 ${stage.order}</div><h2>${esc(stage.title)}</h2><div class="stage-subtitle">${esc(stage.subtitle)}</div></header><div class="stage-summary">${esc(stage.behavior)}</div>`;
    const fieldSection = document.createElement('section');
    fieldSection.className = 'section';
    fieldSection.innerHTML = '<h3>字段</h3>';
    const stageFields = data.fields.filter(item => item.stage === stage.id);
    if (!stageFields.length) fieldSection.insertAdjacentHTML('beforeend', '<div class="empty">无字段节点</div>');
    stageFields.forEach(item => fieldSection.appendChild(nodeButton(item, 'field')));
    card.appendChild(fieldSection);
    const transformSection = document.createElement('section');
    transformSection.className = 'section';
    transformSection.innerHTML = '<h3>处理与查询</h3>';
    const stageTransforms = data.transformations.filter(item => item.stage === stage.id);
    if (!stageTransforms.length) transformSection.insertAdjacentHTML('beforeend', '<div class="empty">外部输入，不执行处理</div>');
    stageTransforms.forEach(item => transformSection.appendChild(nodeButton(item, 'transform')));
    card.appendChild(transformSection);
    card.insertAdjacentHTML('beforeend', `<p class="stage-limit"><strong>边界：</strong>${esc(stage.limitations)}<br><strong>状态键：</strong>${esc(stage.state_key)}</p>`);
    world.appendChild(card);
  }

  for (const transform of data.transformations) {
    transform.inputs.forEach(fieldId => edges.push({from: fieldId, to: transform.id, type: transform.kind}));
    transform.outputs.forEach(fieldId => edges.push({from: transform.id, to: fieldId, type: transform.kind}));
  }

  function applyTransform() {
    world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  }

  function resizeWorld() {
    const cards = [...world.querySelectorAll('.stage')];
    const width = 140 + cards.reduce((sum, card) => sum + card.offsetWidth, 0) + Math.max(0, cards.length - 1) * 105;
    const height = 220 + Math.max(...cards.map(card => card.offsetHeight), 600);
    world.style.width = `${width}px`;
    world.style.height = `${height}px`;
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    drawEdges();
  }

  function centerOf(element) {
    const er = element.getBoundingClientRect();
    const wr = world.getBoundingClientRect();
    return {x: (er.left - wr.left + er.width / 2) / scale, y: (er.top - wr.top + er.height / 2) / scale};
  }

  function createPath(from, to, active, edgeType, stageEdge = false) {
    const dx = Math.max(36, Math.abs(to.x - from.x) * .42);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${from.x} ${from.y} C ${from.x + dx} ${from.y}, ${to.x - dx} ${to.y}, ${to.x} ${to.y}`);
    path.setAttribute('marker-end', 'url(#arrow)');
    path.setAttribute('class', `edge${active ? ' active' : ''}${stageEdge ? ' stage-edge' : ''}${edgeType?.startsWith('model') ? ' model' : ''}${edgeType === 'external-query' ? ' external' : ''}`);
    svg.appendChild(path);
  }

  function relatedSet(rootId) {
    if (!rootId) return new Set();
    const forward = new Map();
    const backward = new Map();
    for (const edge of edges) {
      if (!forward.has(edge.from)) forward.set(edge.from, []);
      if (!backward.has(edge.to)) backward.set(edge.to, []);
      forward.get(edge.from).push(edge.to);
      backward.get(edge.to).push(edge.from);
    }
    const seen = new Set([rootId]);
    const walk = (map, start) => {
      const queue = [start];
      while (queue.length) {
        const current = queue.shift();
        for (const next of map.get(current) || []) {
          if (!seen.has(next)) { seen.add(next); queue.push(next); }
        }
      }
    };
    walk(forward, rootId);
    walk(backward, rootId);
    return seen;
  }

  function drawEdges() {
    [...svg.querySelectorAll('path.edge')].forEach(path => path.remove());
    const related = relatedSet(selected);
    const cards = [...world.querySelectorAll('.stage')];
    for (let i = 0; i < cards.length - 1; i++) {
      const a = centerOf(cards[i].querySelector('.stage-header'));
      const b = centerOf(cards[i + 1].querySelector('.stage-header'));
      createPath({x: a.x + cards[i].offsetWidth / 2, y: a.y}, {x: b.x - cards[i + 1].offsetWidth / 2, y: b.y}, false, '', true);
    }
    for (const edge of edges) {
      const fromEl = nodes.get(edge.from);
      const toEl = nodes.get(edge.to);
      if (!fromEl || !toEl) continue;
      const active = selected && related.has(edge.from) && related.has(edge.to);
      if (!showAll.checked && !active) continue;
      createPath(centerOf(fromEl), centerOf(toEl), active, edge.type);
    }
  }

  function connections(id, direction) {
    const ids = edges.filter(edge => direction === 'up' ? edge.to === id : edge.from === id).map(edge => direction === 'up' ? edge.from : edge.to);
    return ids.map(value => fields.get(value)?.path || transforms.get(value)?.title || value);
  }

  function showDetail(item) {
    const stage = stageMap.get(item.stage);
    if (item.nodeType === 'field') {
      detailBody.innerHTML = `<h2>字段</h2><div class="path">${esc(item.path)}</div><dl><dt>阶段</dt><dd>${esc(stage.title)}</dd><dt>类型</dt><dd>${esc(item.type)}</dd><dt>含义</dt><dd>${esc(item.meaning)}</dd><dt>缺失或失败时</dt><dd>${esc(item.missing)}</dd><dt>直接上游</dt><dd>${list(connections(item.id, 'up'))}</dd><dt>直接下游</dt><dd>${list(connections(item.id, 'down'))}</dd></dl>`;
    } else {
      detailBody.innerHTML = `<h2>${esc(item.title)}</h2><div class="path">${esc(item.kind)}</div><dl><dt>阶段</dt><dd>${esc(stage.title)}</dd><dt>处理</dt><dd>${esc(item.operation)}</dd><dt>输入字段</dt><dd>${list(item.inputs.map(id => fields.get(id)?.path || id))}</dd><dt>输出字段</dt><dd>${list(item.outputs.map(id => fields.get(id)?.path || id))}</dd><dt>分支与约束</dt><dd>${list(item.branches || [])}</dd><dt>实现位置</dt><dd><code>${esc(item.source)}</code></dd></dl>`;
    }
    detail.hidden = false;
  }

  function list(values) {
    if (!values.length) return '<span class="node-meta">无</span>';
    return `<ul>${values.map(value => `<li>${esc(value)}</li>`).join('')}</ul>`;
  }

  function selectNode(id) {
    selected = id;
    const related = relatedSet(id);
    for (const [nodeId, element] of nodes) {
      element.classList.toggle('selected', nodeId === id);
      element.classList.toggle('related', nodeId !== id && related.has(nodeId));
      element.classList.toggle('dim', !related.has(nodeId));
    }
    const item = fields.get(id) || transforms.get(id);
    if (item) showDetail(item);
    drawEdges();
  }

  function clearSelection() {
    selected = null;
    for (const element of nodes.values()) element.classList.remove('selected', 'related', 'dim');
    detail.hidden = true;
    drawEdges();
  }

  function fit() {
    const bounds = workspace.getBoundingClientRect();
    const wanted = Math.min((bounds.width - 40) / world.offsetWidth, (bounds.height - 50) / world.offsetHeight, 1);
    scale = Math.max(.18, wanted);
    panX = 20;
    panY = 20;
    applyTransform();
    drawEdges();
  }

  search.addEventListener('input', () => {
    const query = search.value.trim().toLocaleLowerCase();
    if (!query) { clearSelection(); return; }
    let first = null;
    for (const [id, element] of nodes) {
      const item = fields.get(id) || transforms.get(id);
      const haystack = JSON.stringify(item).toLocaleLowerCase();
      const match = haystack.includes(query);
      element.classList.toggle('dim', !match);
      element.classList.toggle('related', match);
      if (match && !first) first = id;
    }
    selected = null;
    detail.hidden = true;
    drawEdges();
  });
  showAll.addEventListener('change', drawEdges);
  document.getElementById('reset').addEventListener('click', () => { search.value = ''; clearSelection(); });
  document.getElementById('closeDetail').addEventListener('click', clearSelection);
  document.getElementById('fit').addEventListener('click', fit);
  document.getElementById('zoomIn').addEventListener('click', () => { scale = Math.min(1.6, scale * 1.18); applyTransform(); drawEdges(); });
  document.getElementById('zoomOut').addEventListener('click', () => { scale = Math.max(.18, scale / 1.18); applyTransform(); drawEdges(); });
  workspace.addEventListener('wheel', event => {
    event.preventDefault();
    const rect = workspace.getBoundingClientRect();
    const mouseX = event.clientX - rect.left;
    const mouseY = event.clientY - rect.top;
    const beforeX = (mouseX - panX) / scale;
    const beforeY = (mouseY - panY) / scale;
    scale = Math.max(.18, Math.min(1.6, scale * (event.deltaY < 0 ? 1.1 : .9)));
    panX = mouseX - beforeX * scale;
    panY = mouseY - beforeY * scale;
    applyTransform();
    drawEdges();
  }, {passive: false});
  workspace.addEventListener('pointerdown', event => {
    if (event.target.closest('.node, .detail, .toolbar')) return;
    dragging = true;
    dragStart = {x: event.clientX, y: event.clientY, panX, panY};
    workspace.classList.add('dragging');
    workspace.setPointerCapture(event.pointerId);
  });
  workspace.addEventListener('pointermove', event => {
    if (!dragging) return;
    panX = dragStart.panX + event.clientX - dragStart.x;
    panY = dragStart.panY + event.clientY - dragStart.y;
    applyTransform();
  });
  workspace.addEventListener('pointerup', event => {
    dragging = false;
    workspace.classList.remove('dragging');
    if (workspace.hasPointerCapture(event.pointerId)) workspace.releasePointerCapture(event.pointerId);
  });
  window.addEventListener('resize', resizeWorld);
  applyTransform();
  requestAnimationFrame(() => { resizeWorld(); fit(); });
})();
</script>
</body>
</html>
