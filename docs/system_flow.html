<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SV Investigator：确定性基线与受约束自适应调查</title>
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f4f6f8, #0e1116);
  --panel: light-dark(#ffffff, #171c24);
  --panel-2: light-dark(#f8fafc, #202733);
  --text: light-dark(#17202a, #edf2f7);
  --muted: light-dark(#617080, #a8b3c2);
  --border: light-dark(#cfd7e1, #3b4655);
  --primary: light-dark(#235ea7, #79b8ff);
  --field: light-dark(#e9f2ff, #18314e);
  --det: light-dark(#e7f6ed, #173d2a);
  --model: light-dark(#fff3d6, #4a3512);
  --external: light-dark(#f1eafe, #342555);
  --schema: light-dark(#feecee, #4b2028);
  --danger: light-dark(#b42318, #ff8a80);
  --shadow: light-dark(rgba(20, 35, 55, .14), rgba(0, 0, 0, .35));
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
button, input { font: inherit; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.toolbar { z-index: 30; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border); box-shadow: 0 2px 12px var(--shadow); }
.title-block { min-width: 270px; margin-right: auto; }
.title-block h1 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
.title-block p { margin: 0; color: var(--muted); font-size: 12px; }
.control { border: 1px solid var(--border); color: var(--text); background: var(--panel-2); border-radius: 7px; min-height: 36px; padding: 7px 10px; }
button.control { cursor: pointer; }
button.control:hover { border-color: var(--primary); }
.search { width: min(320px, 42vw); }
.toggle { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
.workspace { position: relative; overflow: hidden; touch-action: none; cursor: grab; }
.workspace.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; padding: 92px 70px 120px; display: flex; gap: 105px; align-items: flex-start; }
.edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 4; }
.stage { position: relative; z-index: 3; width: 410px; flex: 0 0 410px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px var(--shadow); overflow: hidden; }
.stage-header { padding: 15px 17px; border-bottom: 1px solid var(--border); background: var(--panel-2); }
.stage-index { color: var(--primary); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
.stage h2 { margin: 3px 0 2px; font-size: 19px; font-weight: 600; }
.stage-subtitle { color: var(--muted); font-size: 12px; }
.stage-summary { padding: 12px 17px; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--border); }
.section { padding: 11px 12px 14px; }
.section + .section { border-top: 1px solid var(--border); }
.section h3 { margin: 0 4px 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.node { width: 100%; text-align: left; border: 1px solid transparent; border-radius: 8px; color: var(--text); padding: 9px 10px; margin: 6px 0; cursor: pointer; transition: opacity .14s, border-color .14s, transform .14s; }
.node:hover, .node:focus-visible { border-color: var(--primary); outline: none; transform: translateY(-1px); }
.field-node { background: var(--field); }
.transform-node { background: var(--det); }
.transform-node[data-kind="model-controlled"], .transform-node[data-kind="model-structured"] { background: var(--model); }
.transform-node[data-kind="external-query"] { background: var(--external); }
.transform-node[data-kind="schema-validation"] { background: var(--schema); }
.node-path { display: block; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
.node-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
.node.dim { opacity: .16; }
.node.related { border-color: var(--primary); }
.node.selected { border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 30%, transparent); }
.stage-limit { margin: 0; padding: 11px 16px 14px; color: var(--muted); font-size: 12px; border-top: 1px dashed var(--border); }
.edge { fill: none; stroke: var(--border); stroke-width: 1.2; opacity: .12; }
.edge.active { stroke: var(--primary); stroke-width: 2.2; opacity: .88; }
.edge.external.active { stroke: light-dark(#6b45b5, #b39cff); }
.edge.model.active { stroke: light-dark(#a56500, #ffc766); }
.detail { position: absolute; z-index: 25; top: 14px; right: 14px; width: min(390px, calc(100% - 28px)); max-height: calc(100% - 28px); overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 32px var(--shadow); padding: 16px; }
.detail[hidden] { display: none; }
.detail h2 { margin: 0 34px 4px 0; font-size: 17px; }
.detail .path { color: var(--primary); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
.detail dl { margin: 14px 0 0; }
.detail dt { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; margin-top: 12px; }
.detail dd { margin: 4px 0 0; font-size: 13px; line-height: 1.55; }
.detail ul { margin: 5px 0 0; padding-left: 18px; }
.close { position: absolute; right: 10px; top: 10px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 20px; }
.legend { position: absolute; z-index: 20; left: 14px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; max-width: calc(100% - 28px); padding: 9px 12px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--border); border-radius: 8px; font-size: 11px; color: var(--muted); }
.key { display: inline-flex; align-items: center; gap: 5px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--border); }
.swatch.field { background: var(--field); }.swatch.det { background: var(--det); }.swatch.model { background: var(--model); }.swatch.external { background: var(--external); }.swatch.schema { background: var(--schema); }
.empty { color: var(--muted); padding: 8px; font-size: 12px; }
@media (max-width: 720px) {
  .title-block { width: 100%; }
  .search { width: 100%; }
  .stage { width: 350px; flex-basis: 350px; }
  .world { gap: 75px; padding-left: 35px; }
  .legend { display: none; }
}
</style>
</head>
<body>
<main class="app">
  <header class="toolbar">
    <div class="title-block">
      <h1>SV Investigator：确定性基线与受约束自适应调查</h1>
      <p>点击节点查看直接处理关系；可切换完整上下游。拖动画布，滚轮缩放。</p>
    </div>
    <input id="search" class="control search" type="search" aria-label="搜索字段或处理" placeholder="搜索字段、含义、数据库或规则">
    <button id="zoomOut" class="control" type="button" aria-label="缩小">−</button>
    <button id="zoomIn" class="control" type="button" aria-label="放大">＋</button>
    <button id="fit" class="control" type="button">适合窗口</button>
    <button id="reset" class="control" type="button">清除选择</button>
    <label class="toggle"><input id="traceAll" type="checkbox">追踪完整上下游</label>
    <label class="toggle"><input id="showAll" type="checkbox">显示全部字段连线</label>
  </header>
  <section id="workspace" class="workspace" aria-label="SV Investigator 字段级流程图">
    <div id="world" class="world">
      <svg id="edges" class="edges" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"></path></marker></defs></svg>
    </div>
    <aside id="detail" class="detail" aria-live="polite" hidden><button id="closeDetail" class="close" type="button" aria-label="关闭详情">×</button><div id="detailBody"></div></aside>
    <div class="legend" aria-label="图例">
      <span class="key"><span class="swatch field"></span>字段</span>
      <span class="key"><span class="swatch det"></span>固定规则</span>
      <span class="key"><span class="swatch model"></span>模型整理</span>
      <span class="key"><span class="swatch external"></span>外部查询</span>
      <span class="key"><span class="swatch schema"></span>Schema 验证</span>
      <span class="key">源指纹 b2bd4d819a29</span>
    </div>
  </section>
</main>
<script id="lineage-data" type="application/json">{"metadata":{"title":"SV Investigator：确定性基线与受约束自适应调查","version":"1.1.0","coordinate_system":"1-based-inclusive","description":"字段级可追踪架构；点击字段或处理节点查看输入、规则、输出与边界。"},"stages":[{"id":"input","order":0,"title":"用户输入","subtitle":"一个候选 SV","state_key":"user_message","behavior":"接收坐标、参考基因组、SVTYPE、断点不确定性、统计和质量信息。","source":"README.md / tools.py:normalize_sv_input","limitations":"必须明确 build、chrom、start、end、sv_type；坐标固定为 1-based inclusive。"},{"id":"normalize","order":1,"title":"确定性标准化","subtitle":"InputNormalizerAgent + normalize_sv_input","state_key":"normalized_sv","behavior":"统一 build、染色体与 SVTYPE，验证坐标，解析 CI 和 BND mate；工具直接把完整结果写入状态。","source":"prompts.py:INTAKE / state_pipeline.py:normalize_and_store","limitations":"不做 liftover，不接受 alternate contig，不推断缺失核心字段。"},{"id":"baseline","order":2,"title":"不可跳过的证据基线","subtitle":"BaselineEvidenceCollectorAgent + collect_baseline_evidence","state_key":"baseline_evidence","behavior":"一次固定调用收集 Ensembl、gnomAD-SV 和技术风险；工具直接保存带证据 ID 的完整结果。","source":"prompts.py:BASELINE / state_pipeline.py:baseline_and_store","limitations":"仅 Ensembl 空间重叠、gnomAD-SV 和已有质量字段；查询失败不等于无记录。"},{"id":"adaptive","order":3,"title":"受约束的自适应调查","subtitle":"AdaptiveInvestigationAgent + adaptive_followup_query","state_key":"adaptive_investigation","behavior":"LLM 选择 0–2 个后续动作并解释；工具原始结果另存 adaptive_tool_results，不由模型转写。","source":"prompts.py:ADAPTIVE / state_pipeline.py:adaptive_and_store","limitations":"硬上限 2；不能改候选字段或匹配阈值；未实现 VEP、DGV、dbVar、ClinGen、ClinVar。"},{"id":"literature","order":4,"title":"自适应文献检索","subtitle":"LiteratureAndFunctionAgent + search_pubmed","state_key":"literature_evidence","behavior":"LLM 选择 PubMed 查询；工具硬性限制最多 3 个不同查询、每次默认 5 篇并跨查询去重 PMID；结果另存 literature_tool_results。","source":"prompts.py:LITERATURE / state_pipeline.py:literature_and_store","limitations":"只返回元数据和前三位作者姓名及总人数；标题不能证明机制或因果。"},{"id":"verify","order":5,"title":"证据核验","subtitle":"EvidenceVerifierAgent","state_key":"verification","behavior":"把陈述拆成原子 claim，核验 evidence ID，拒绝无证据事实与过度解释。","source":"prompts.py:VERIFY / schemas.py:VerificationOutput","limitations":"模型判断受到结构化 schema 与现有证据 ID 约束。"},{"id":"report","order":6,"title":"最终报告","subtitle":"ReportWriterAgent + SVReport","state_key":"final_report","behavior":"生成带证据目录、来源和自适应调查日志的结构化报告，并做确定性 schema 校验。","source":"prompts.py:REPORT / schemas.py:SVReport","limitations":"重要数据缺失时 incomplete；输入无效时 blocked。"}],"fields":[{"id":"raw.core","path":"input.{genome_build,chrom,start,end,sv_type}","stage":"input","type":"object","meaning":"候选身份的五个必填字段。","missing":"任一缺失即 validation_error。"},{"id":"raw.ci","path":"input.{CIPOS,CIEND,CIMATE,IMPRECISE}","stage":"input","type":"object|null","meaning":"VCF 断点不确定性及不精确标志；[0,0] 表示零宽区间，不表示缺失。","missing":"省略或设为 null；下游仅用带标签的 ±500 bp fallback 检索附近候选。"},{"id":"raw.bnd","path":"input.{ALT,mate_chrom,mate_pos,CHR2,END}","stage":"input","type":"object|null","meaning":"BND mate 坐标与方向来源。","missing":"BND 降级为 first-breakend-only。"},{"id":"raw.context","path":"input.{sv_id,length_bp,statistics,quality,source_record}","stage":"input","type":"object|null","meaning":"上游标识、长度、统计、质量和原 VCF 记录。","missing":"保留显式 warning 或空对象。"},{"id":"norm.status","path":"normalized_sv.status/error","stage":"normalize","type":"valid|validation_error","meaning":"控制后续阶段是否执行。","missing":"始终产生。"},{"id":"norm.identity","path":"normalized_sv.{sv_id,genome_build,chrom,start,end,sv_type}","stage":"normalize","type":"object","meaning":"验证并规范化后的不可变候选身份。","missing":"输入无效时不构造有效身份。"},{"id":"norm.originals","path":"normalized_sv.{genome_build_original,sv_type_original,sv_subtype,normalizations}","stage":"normalize","type":"object","meaning":"标准化前值、移动元件亚型与变更审计。","missing":"有效输入时产生。"},{"id":"norm.coordinates","path":"normalized_sv.{coordinate_system,chromosome_length_bp,length_bp}","stage":"normalize","type":"object","meaning":"1-based inclusive 约定、染色体边界和长度。","missing":"INS/BND 未给长度时 length_bp 为 null。"},{"id":"norm.ci","path":"normalized_sv.{cipos,ciend,start_confidence_interval,end_confidence_interval,breakpoint_uncertainty_status,imprecise}","stage":"normalize","type":"object","meaning":"相对 CI、裁剪后的绝对 CI 及完整度。","missing":"CI 为 null，状态为 not_provided。"},{"id":"norm.bnd","path":"normalized_sv.{bnd_mate_status,mate_chrom,mate_pos,mate_confidence_interval,local_orientation,mate_orientation}","stage":"normalize","type":"object","meaning":"解析后的 BND 第二断点和邻接方向。","missing":"无 mate 时显式 not_provided。"},{"id":"norm.context","path":"normalized_sv.{statistics,quality,source_record,warnings}","stage":"normalize","type":"object","meaning":"不解释地保留上游统计、质量和来源。","missing":"缺失项进入 warnings。"},{"id":"base.contract","path":"baseline_evidence.{collection_policy,immutable_candidate_fields}","stage":"baseline","type":"object","meaning":"声明基线不可跳过，并复制不得被自适应阶段修改的候选字段。","missing":"有效输入时产生。"},{"id":"base.region","path":"baseline_evidence.region_annotation.features","stage":"baseline","type":"gene/regulatory/repeat records|null","meaning":"名义区间的 Ensembl 空间重叠；记录带 ENS-BL ID。","missing":"空数组=成功无记录；null=查询失败。"},{"id":"base.breakpoints","path":"baseline_evidence.region_annotation.breakpoint_annotations.{start,end,mate}","stage":"baseline","type":"object","meaning":"由 VCF CI 或带标签 fallback 构造的各断点窗口及 overlap 结果。","missing":"无 BND mate 时 mate 为 null。"},{"id":"base.region_meta","path":"baseline_evidence.region_annotation.{errors,truncated,attempts,source_urls,completeness,limitations}","stage":"baseline","type":"object","meaning":"Ensembl 逐类错误、截断、尝试次数、来源与空间重叠限制。","missing":"重试耗尽仍保持 error/null，不转成 not_found。"},{"id":"base.gnomad_records","path":"baseline_evidence.database_evidence.records[]","stage":"baseline","type":"GNO-BL evidence records","meaning":"gnomAD-SV 坐标、类型、AC/AN/AF、filters、匹配类别与指标。","missing":"成功无候选时为空数组。"},{"id":"base.gnomad_query","path":"baseline_evidence.database_evidence.{dataset,query_regions,breakpoint_windows,matching_query_regions}","stage":"baseline","type":"object","meaning":"build 对应数据集、实际检索区域与固定匹配窗口。","missing":"API 失败时保留 query_errors。"},{"id":"base.gnomad_audit","path":"baseline_evidence.database_evidence.{counts,query_errors,retrieved_at,limitations}","stage":"baseline","type":"object","meaning":"筛选计数、失败、检索时间和同一事件判定限制。","missing":"始终保留状态。"},{"id":"base.risk","path":"baseline_evidence.artifact_risk.{overall_risk,risk_items}","stage":"baseline","type":"object","meaning":"call rate、caller、repeat、mappability、reads、GQ、batch 的确定性初筛。","missing":"数据不足保持 unknown。"},{"id":"adapt.gaps","path":"adaptive_investigation.identified_evidence_gaps","stage":"adaptive","type":"string[]","meaning":"LLM 从基线中识别的具体未决问题。","missing":"没有实质缺口时为空。"},{"id":"adapt.plan","path":"adaptive_investigation.planned_actions","stage":"adaptive","type":"action[]","meaning":"每个候选动作的缺口、理由和预期信息增益。","missing":"没有合格动作时为空。"},{"id":"adapt.audit","path":"adaptive_tool_results[]","stage":"adaptive","type":"audited action[]","meaning":"工具直接写入状态的完整执行/拒绝记录、预算与真实结果；模型不转写。","missing":"零调用时为空。"},{"id":"adapt.ensembl","path":"adaptive_tool_results[].result.result.Ensembl","stage":"adaptive","type":"ENS-ADP records","meaning":"可选最近基因、transcript、exon 或 BND mate transcript 空间重叠。","missing":"未选动作或无记录时为空。"},{"id":"adapt.gnomad","path":"adaptive_tool_results[].result.result.gnomAD-SV","stage":"adaptive","type":"GNO-ADP records","meaning":"扩大 2/10 kb 检索后取得的新候选；匹配窗口和阈值保持不变。","missing":"未选动作或无记录时为空。"},{"id":"adapt.stop","path":"adaptive_investigation.{stop_reason,remaining_limitations}","stage":"adaptive","type":"object","meaning":"为何停止以及工具白名单仍无法解决的问题。","missing":"必须给出 stop_reason。"},{"id":"lit.queries","path":"literature_evidence.queries","stage":"literature","type":"string[0..3]","meaning":"区域/SVTYPE 和实际返回基因驱动的透明 PubMed 查询。","missing":"无有用查询时为空。"},{"id":"lit.records","path":"literature_tool_results[].records[]","stage":"literature","type":"PMID metadata[]","meaning":"工具保存去重后的 PMID、标题、前三位作者姓名、作者总数、期刊、日期、DOI、URL 和 PMID 证据 ID。","missing":"未命中为空；失败显式 error。"},{"id":"lit.tool_audit","path":"literature_tool_results[].{query_budget,queries_used,queries_remaining,duplicate_pmids_excluded,returned_record_count}","stage":"literature","type":"object","meaning":"程序级查询预算和跨查询 PMID 去重计数；被拒绝的调用不触发 API。","missing":"无查询时结果列表为空。"},{"id":"lit.audit","path":"literature_evidence.{missing_sources,limitations}","stage":"literature","type":"object","meaning":"未实现来源和标题级证据限制。","missing":"按需产生。"},{"id":"verify.claims","path":"verification.{supported_claims,rejected_claims}","stage":"verify","type":"VerifiedClaim[]","meaning":"带 evidence ID、claim 类型、置信度和核验状态的原子陈述。","missing":"默认空数组。"},{"id":"verify.audit","path":"verification.{publication_allowed,contradictions,missing_evidence,warnings}","stage":"verify","type":"object","meaning":"发布门、矛盾、缺证和核验警告。","missing":"schema 要求 publication_allowed。"},{"id":"report.summary","path":"final_report.sv_summary","stage":"report","type":"SVSummary","meaning":"只复制标准化候选身份、CI 和 BND 字段。","missing":"无效输入保留可用原字段并 blocked。"},{"id":"report.sections","path":"final_report.*_evidence/artifact_risks/possible_interpretations","stage":"report","type":"ReportStatement[]","meaning":"按统计、区域、人群、文献、功能、技术风险和解释组织的有证据陈述。","missing":"默认空数组。"},{"id":"report.catalog","path":"final_report.{evidence_catalog,query_provenance}","stage":"report","type":"object","meaning":"被引用证据与外部查询来源目录；ID 必须唯一且可解析。","missing":"无引用时为空。"},{"id":"report.investigation","path":"final_report.investigation_log","stage":"report","type":"InvestigationLog","meaning":"复制证据缺口、计划、执行动作、2 次预算、停止原因和剩余限制。","missing":"必填并经 schema 校验。"},{"id":"report.status","path":"final_report.{report_version,report_status,limitations,recommended_next_steps}","stage":"report","type":"object","meaning":"报告版本、完成状态、限制和可复现下一步。","missing":"schema 强制状态。"}],"transformations":[{"id":"n.validate","stage":"normalize","title":"核心解析与边界校验","kind":"deterministic","inputs":["raw.core"],"outputs":["norm.status","norm.identity","norm.coordinates"],"operation":"解析 JSON，标准化 build/chrom/SVTYPE，验证整数、顺序、正长度和染色体范围；固定 1-based inclusive。","branches":["无效输入返回 validation_error"],"source":"tools.py:normalize_sv_input"},{"id":"n.uncertainty","stage":"normalize","title":"CI 与 BND 标准化","kind":"deterministic","inputs":["raw.ci","raw.bnd","norm.identity"],"outputs":["norm.ci","norm.bnd"],"operation":"相对 CI 转绝对坐标并裁剪；解析四种 BND ALT 或显式 mate；可选无效 mate 只警告。","branches":["缺 CI 不伪造测量区间","缺 mate 保留 first-breakend-only"],"source":"tools.py:_absolute_confidence_interval/_optional_bnd_mate"},{"id":"n.preserve","stage":"normalize","title":"保留原值与上下文","kind":"deterministic","inputs":["raw.core","raw.context"],"outputs":["norm.originals","norm.context"],"operation":"记录别名映射，原样保留统计、质量和 source_record。","branches":[],"source":"tools.py:normalize_sv_input"},{"id":"b.contract","stage":"baseline","title":"固定基线调用门","kind":"deterministic","inputs":["norm.status","norm.identity","norm.ci","norm.bnd","norm.context"],"outputs":["base.contract"],"operation":"工具从状态读取标准化输入，直接保存完整基线结果；无效输入记录 blocked，模型不负责转写。","branches":["validation_error → blocked"],"source":"state_pipeline.py:baseline_and_store"},{"id":"b.ensembl","stage":"baseline","title":"Ensembl 基线 overlap","kind":"external-query","inputs":["norm.identity","norm.ci","norm.bnd"],"outputs":["base.region","base.breakpoints","base.region_meta"],"operation":"重新校验坐标后查询名义区间及 start/end/mate 窗口的 gene、regulatory、repeat；相同区间复用，瞬时错误有限重试、全局限并发；保留错误、尝试次数、截断、URL 和 ENS-BL ID。","branches":["CI 缺失使用带标签 ±500 bp fallback","重试耗尽保留 error，不当作无注释"],"source":"tools.py:query_ensembl_region"},{"id":"b.gnomad","stage":"baseline","title":"gnomAD-SV 基线与固定匹配","kind":"external-query","inputs":["norm.identity","norm.ci","norm.bnd"],"outputs":["base.gnomad_records","base.gnomad_query","base.gnomad_audit"],"operation":"重新校验已存候选坐标；按 build 选数据集，检索候选并用类型、重叠和断点规则分类；缺失 CI 时 ±500 bp 只扩展检索，不单独提升 high_similarity；添加 GNO-BL ID。","branches":["BND 有 mate 比较双端；无 mate 只比较第一端且不能确认同一事件"],"source":"tools.py:query_gnomad_sv"},{"id":"b.risk","stage":"baseline","title":"确定性技术风险","kind":"deterministic","inputs":["norm.context","base.breakpoints"],"outputs":["base.risk"],"operation":"根据质量字段和断点 repeat 判断风险；布尔伪数字或范围外 call rate 不参与数值判定。","branches":["缺失、类型错误或范围错误保持 unknown"],"source":"tools.py:assess_artifact_risk"},{"id":"a.decide","stage":"adaptive","title":"识别缺口与选择动作","kind":"model-controlled","inputs":["norm.identity","norm.ci","norm.bnd","base.region","base.gnomad_records","base.risk"],"outputs":["adapt.gaps","adapt.plan"],"operation":"只有缺口明确、工具能减少不确定性、未重复、预算存在且可能改变解释时才计划动作。","branches":["无合格动作直接停止"],"source":"prompts.py:ADAPTIVE"},{"id":"a.guard","stage":"adaptive","title":"白名单、去重与硬预算","kind":"deterministic","inputs":["adapt.plan","norm.identity"],"outputs":["adapt.audit"],"operation":"先以短锁原子预留 ToolContext state 中的名额，再执行外部请求；强制最多 2 次并直接保存每次工具返回，拒绝非白名单和重复动作。","branches":["拒绝项不执行外部查询","外部失败仍消耗已预留预算"],"source":"state_pipeline.py:adaptive_and_store / tools.py:run_budgeted_adaptive_action"},{"id":"a.ensembl","stage":"adaptive","title":"可选 Ensembl 精化","kind":"external-query","inputs":["adapt.audit","norm.identity","norm.bnd"],"outputs":["adapt.ensembl"],"operation":"按已选动作查询 10/50 kb 最近基因、transcript、exon 或 BND mate transcript；瞬时错误有限重试，保留尝试次数和 ENS-ADP ID。","branches":["BND mate action 无 mate 时 not_applicable","重试耗尽保留 error","重叠不等于 consequence"],"source":"tools.py:_ensembl_adaptive_query"},{"id":"a.gnomad","stage":"adaptive","title":"可选 gnomAD 检索扩展","kind":"external-query","inputs":["adapt.audit","base.gnomad_query","norm.identity","norm.ci"],"outputs":["adapt.gnomad"],"operation":"只将 API 检索区域扩大 2 kb 或 10 kb；分类仍使用基线固定窗口与阈值。","branches":["新取得但窗外的记录仍为 nearby"],"source":"tools.py:query_gnomad_sv(retrieval_padding_bp)"},{"id":"a.stop","stage":"adaptive","title":"停止与剩余限制","kind":"model-controlled","inputs":["adapt.gaps","adapt.plan","adapt.audit","adapt.ensembl","adapt.gnomad"],"outputs":["adapt.stop"],"operation":"说明停止原因和白名单无法覆盖的剩余问题，不把未用预算描述为失败。","branches":[],"source":"prompts.py:ADAPTIVE"},{"id":"l.search","stage":"literature","title":"证据驱动 PubMed 查询","kind":"external-query","inputs":["norm.identity","base.region","adapt.ensembl"],"outputs":["lit.queries","lit.records","lit.tool_audit","lit.audit"],"operation":"以短锁原子预留查询名额并合并去重结果；限制最多 3 个不同查询、每次默认 5 篇，压缩作者信息并保存证据 ID、计数和错误。","branches":["重复查询或超预算拒绝且不访问 API","异常响应显式 error，不伪装为无记录","失败查询仍占一个名额","不得从模型记忆补基因"],"source":"state_pipeline.py:literature_and_store / tools.py:search_pubmed"},{"id":"v.ground","stage":"verify","title":"原子 claim 与证据核验","kind":"model-structured","inputs":["norm.context","base.region","base.gnomad_records","base.risk","adapt.audit","adapt.ensembl","adapt.gnomad","lit.records"],"outputs":["verify.claims","verify.audit"],"operation":"事实 claim 必须引用已有 ID；区分 observation/database_fact/inference/hypothesis 并拒绝过度解释。","branches":["检索扩展不能改变匹配语义","标题不能支持机制"],"source":"prompts.py:VERIFY / schemas.py:VerificationOutput"},{"id":"p.compose","stage":"report","title":"按证据编排报告","kind":"model-structured","inputs":["norm.identity","norm.originals","norm.coordinates","norm.ci","norm.bnd","base.region","base.gnomad_records","base.risk","adapt.gaps","adapt.plan","adapt.audit","adapt.stop","lit.records","verify.claims","verify.audit"],"outputs":["report.summary","report.sections","report.catalog","report.investigation","report.status"],"operation":"只组合前序状态；复制调查审计；不恢复 rejected claim，不凭模型记忆补证据。","branches":["输入无效 blocked；重要缺失 incomplete"],"source":"prompts.py:REPORT"},{"id":"p.validate","stage":"report","title":"Pydantic 确定性验证","kind":"schema-validation","inputs":["report.summary","report.sections","report.catalog","report.investigation","report.status"],"outputs":["report.status"],"operation":"验证候选坐标、证据 ID 引用唯一性以及固定为 2 的 adaptive 预算；queries_used 必须等于真正执行的动作数，拒绝动作只保留审计。","branches":["悬空 evidence ID、越界坐标、动作计数不一致或超预算报告被拒绝"],"source":"schemas.py:SVReport"}]}</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById('lineage-data').textContent);
  const workspace = document.getElementById('workspace');
  const world = document.getElementById('world');
  const svg = document.getElementById('edges');
  const detail = document.getElementById('detail');
  const detailBody = document.getElementById('detailBody');
  const search = document.getElementById('search');
  const traceAll = document.getElementById('traceAll');
  const showAll = document.getElementById('showAll');
  const nodes = new Map();
  const fields = new Map(data.fields.map(x => [x.id, {...x, nodeType: 'field'}]));
  const transforms = new Map(data.transformations.map(x => [x.id, {...x, nodeType: 'transform'}]));
  const stages = [...data.stages].sort((a, b) => a.order - b.order);
  const stageMap = new Map(stages.map(x => [x.id, x]));
  const edges = [];
  let selected = null;
  let scale = 0.72;
  let panX = 24;
  let panY = 30;
  let dragging = false;
  let dragStart = null;

  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const nodeButton = (item, type) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = `node ${type}-node`;
    button.dataset.id = item.id;
    if (type === 'transform') button.dataset.kind = item.kind;
    const main = type === 'field' ? item.path : item.title;
    const meta = type === 'field' ? item.type : item.kind;
    button.innerHTML = `<span class="node-path">${esc(main)}</span><span class="node-meta">${esc(meta)}</span>`;
    button.addEventListener('click', event => {
      event.stopPropagation();
      selectNode(item.id);
    });
    nodes.set(item.id, button);
    return button;
  };

  for (const stage of stages) {
    const card = document.createElement('article');
    card.className = 'stage';
    card.dataset.stage = stage.id;
    card.innerHTML = `<header class="stage-header"><div class="stage-index">阶段 ${stage.order}</div><h2>${esc(stage.title)}</h2><div class="stage-subtitle">${esc(stage.subtitle)}</div></header><div class="stage-summary">${esc(stage.behavior)}</div>`;
    const fieldSection = document.createElement('section');
    fieldSection.className = 'section';
    fieldSection.innerHTML = '<h3>字段</h3>';
    const stageFields = data.fields.filter(item => item.stage === stage.id);
    if (!stageFields.length) fieldSection.insertAdjacentHTML('beforeend', '<div class="empty">无字段节点</div>');
    stageFields.forEach(item => fieldSection.appendChild(nodeButton(item, 'field')));
    card.appendChild(fieldSection);
    const transformSection = document.createElement('section');
    transformSection.className = 'section';
    transformSection.innerHTML = '<h3>处理与查询</h3>';
    const stageTransforms = data.transformations.filter(item => item.stage === stage.id);
    if (!stageTransforms.length) transformSection.insertAdjacentHTML('beforeend', '<div class="empty">外部输入，不执行处理</div>');
    stageTransforms.forEach(item => transformSection.appendChild(nodeButton(item, 'transform')));
    card.appendChild(transformSection);
    card.insertAdjacentHTML('beforeend', `<p class="stage-limit"><strong>边界：</strong>${esc(stage.limitations)}<br><strong>状态键：</strong>${esc(stage.state_key)}</p>`);
    world.appendChild(card);
  }

  for (const transform of data.transformations) {
    transform.inputs.forEach(fieldId => edges.push({from: fieldId, to: transform.id, type: transform.kind}));
    transform.outputs.forEach(fieldId => edges.push({from: transform.id, to: fieldId, type: transform.kind}));
  }

  function applyTransform() {
    world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  }

  function resizeWorld() {
    const cards = [...world.querySelectorAll('.stage')];
    const width = 140 + cards.reduce((sum, card) => sum + card.offsetWidth, 0) + Math.max(0, cards.length - 1) * 105;
    const height = 220 + Math.max(...cards.map(card => card.offsetHeight), 600);
    world.style.width = `${width}px`;
    world.style.height = `${height}px`;
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    drawEdges();
  }

  function portOf(element, side) {
    const er = element.getBoundingClientRect();
    const wr = world.getBoundingClientRect();
    const x = side === 'left' ? er.left : er.right;
    return {x: (x - wr.left) / scale, y: (er.top - wr.top + er.height / 2) / scale};
  }

  function createPath(edge, active) {
    const fromEl = nodes.get(edge.from);
    const toEl = nodes.get(edge.to);
    const fromStage = (fields.get(edge.from) || transforms.get(edge.from)).stage;
    const toStage = (fields.get(edge.to) || transforms.get(edge.to)).stage;
    const sameStage = fromStage === toStage;
    const from = portOf(fromEl, 'right');
    const to = portOf(toEl, sameStage ? 'right' : 'left');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    if (sameStage) {
      // Route internal field → operation → field links through the card gutter.
      // Nothing runs behind an opaque card or across its text.
      const lane = Math.max(from.x, to.x) + 22;
      path.setAttribute('d', `M ${from.x} ${from.y} L ${lane} ${from.y} L ${lane} ${to.y} L ${to.x} ${to.y}`);
    } else {
      const dx = Math.max(25, (to.x - from.x) * .42);
      path.setAttribute('d', `M ${from.x} ${from.y} C ${from.x + dx} ${from.y}, ${to.x - dx} ${to.y}, ${to.x} ${to.y}`);
    }
    path.setAttribute('marker-end', 'url(#arrow)');
    path.setAttribute('class', `edge${active ? ' active' : ''}${edge.type?.startsWith('model') ? ' model' : ''}${edge.type === 'external-query' ? ' external' : ''}`);
    svg.appendChild(path);
  }

  function focusedEdges() {
    if (!selected) return [];
    if (traceAll.checked) {
      const related = relatedSet(selected);
      return edges.filter(edge => related.has(edge.from) && related.has(edge.to));
    }
    if (transforms.has(selected)) {
      return edges.filter(edge => edge.from === selected || edge.to === selected);
    }
    // A field's local view includes each directly connected operation and that
    // operation's immediate input/output fields, but not the rest of the pipeline.
    const operations = new Set(edges.filter(edge => edge.from === selected || edge.to === selected)
      .map(edge => edge.from === selected ? edge.to : edge.from)
      .filter(id => transforms.has(id)));
    return edges.filter(edge => operations.has(edge.from) || operations.has(edge.to));
  }

  function updateFocus() {
    if (!selected) return;
    const related = new Set([selected]);
    for (const edge of focusedEdges()) {
      related.add(edge.from);
      related.add(edge.to);
    }
    for (const [nodeId, element] of nodes) {
      element.classList.toggle('selected', nodeId === selected);
      element.classList.toggle('related', nodeId !== selected && related.has(nodeId));
      element.classList.toggle('dim', !related.has(nodeId));
    }
    drawEdges();
  }

  function relatedSet(rootId) {
    if (!rootId) return new Set();
    const forward = new Map();
    const backward = new Map();
    for (const edge of edges) {
      if (!forward.has(edge.from)) forward.set(edge.from, []);
      if (!backward.has(edge.to)) backward.set(edge.to, []);
      forward.get(edge.from).push(edge.to);
      backward.get(edge.to).push(edge.from);
    }
    const seen = new Set([rootId]);
    const walk = (map, start) => {
      const queue = [start];
      while (queue.length) {
        const current = queue.shift();
        for (const next of map.get(current) || []) {
          if (!seen.has(next)) { seen.add(next); queue.push(next); }
        }
      }
    };
    walk(forward, rootId);
    walk(backward, rootId);
    return seen;
  }

  function drawEdges() {
    [...svg.querySelectorAll('path.edge')].forEach(path => path.remove());
    const activeEdges = new Set(focusedEdges());
    for (const edge of edges) {
      const active = activeEdges.has(edge);
      if (!showAll.checked && !active) continue;
      if (!nodes.has(edge.from) || !nodes.has(edge.to)) continue;
      createPath(edge, active);
    }
  }

  function connections(id, direction) {
    const ids = edges.filter(edge => direction === 'up' ? edge.to === id : edge.from === id).map(edge => direction === 'up' ? edge.from : edge.to);
    return ids.map(value => fields.get(value)?.path || transforms.get(value)?.title || value);
  }

  function showDetail(item) {
    const stage = stageMap.get(item.stage);
    if (item.nodeType === 'field') {
      detailBody.innerHTML = `<h2>字段</h2><div class="path">${esc(item.path)}</div><dl><dt>阶段</dt><dd>${esc(stage.title)}</dd><dt>类型</dt><dd>${esc(item.type)}</dd><dt>含义</dt><dd>${esc(item.meaning)}</dd><dt>缺失或失败时</dt><dd>${esc(item.missing)}</dd><dt>直接上游</dt><dd>${list(connections(item.id, 'up'))}</dd><dt>直接下游</dt><dd>${list(connections(item.id, 'down'))}</dd></dl>`;
    } else {
      detailBody.innerHTML = `<h2>${esc(item.title)}</h2><div class="path">${esc(item.kind)}</div><dl><dt>阶段</dt><dd>${esc(stage.title)}</dd><dt>处理</dt><dd>${esc(item.operation)}</dd><dt>输入字段</dt><dd>${list(item.inputs.map(id => fields.get(id)?.path || id))}</dd><dt>输出字段</dt><dd>${list(item.outputs.map(id => fields.get(id)?.path || id))}</dd><dt>分支与约束</dt><dd>${list(item.branches || [])}</dd><dt>实现位置</dt><dd><code>${esc(item.source)}</code></dd></dl>`;
    }
    detail.hidden = false;
  }

  function list(values) {
    if (!values.length) return '<span class="node-meta">无</span>';
    return `<ul>${values.map(value => `<li>${esc(value)}</li>`).join('')}</ul>`;
  }

  function selectNode(id) {
    selected = id;
    const item = fields.get(id) || transforms.get(id);
    if (item) showDetail(item);
    updateFocus();
  }

  function clearSelection() {
    selected = null;
    for (const element of nodes.values()) element.classList.remove('selected', 'related', 'dim');
    detail.hidden = true;
    drawEdges();
  }

  function fit() {
    const bounds = workspace.getBoundingClientRect();
    const wanted = Math.min((bounds.width - 40) / world.offsetWidth, (bounds.height - 50) / world.offsetHeight, 1);
    scale = Math.max(.18, wanted);
    panX = 20;
    panY = 20;
    applyTransform();
    drawEdges();
  }

  search.addEventListener('input', () => {
    const query = search.value.trim().toLocaleLowerCase();
    if (!query) { clearSelection(); return; }
    for (const [id, element] of nodes) {
      const item = fields.get(id) || transforms.get(id);
      const haystack = JSON.stringify(item).toLocaleLowerCase();
      const match = haystack.includes(query);
      element.classList.toggle('dim', !match);
      element.classList.toggle('related', match);
    }
    selected = null;
    detail.hidden = true;
    drawEdges();
  });
  showAll.addEventListener('change', drawEdges);
  traceAll.addEventListener('change', updateFocus);
  document.getElementById('reset').addEventListener('click', () => { search.value = ''; clearSelection(); });
  document.getElementById('closeDetail').addEventListener('click', clearSelection);
  document.getElementById('fit').addEventListener('click', fit);
  document.getElementById('zoomIn').addEventListener('click', () => { scale = Math.min(1.6, scale * 1.18); applyTransform(); drawEdges(); });
  document.getElementById('zoomOut').addEventListener('click', () => { scale = Math.max(.18, scale / 1.18); applyTransform(); drawEdges(); });
  workspace.addEventListener('wheel', event => {
    event.preventDefault();
    const rect = workspace.getBoundingClientRect();
    const mouseX = event.clientX - rect.left;
    const mouseY = event.clientY - rect.top;
    const beforeX = (mouseX - panX) / scale;
    const beforeY = (mouseY - panY) / scale;
    scale = Math.max(.18, Math.min(1.6, scale * (event.deltaY < 0 ? 1.1 : .9)));
    panX = mouseX - beforeX * scale;
    panY = mouseY - beforeY * scale;
    applyTransform();
    drawEdges();
  }, {passive: false});
  workspace.addEventListener('pointerdown', event => {
    if (event.target.closest('.node, .detail, .toolbar')) return;
    dragging = true;
    dragStart = {x: event.clientX, y: event.clientY, panX, panY};
    workspace.classList.add('dragging');
    workspace.setPointerCapture(event.pointerId);
  });
  workspace.addEventListener('pointermove', event => {
    if (!dragging) return;
    panX = dragStart.panX + event.clientX - dragStart.x;
    panY = dragStart.panY + event.clientY - dragStart.y;
    applyTransform();
  });
  workspace.addEventListener('pointerup', event => {
    dragging = false;
    workspace.classList.remove('dragging');
    if (workspace.hasPointerCapture(event.pointerId)) workspace.releasePointerCapture(event.pointerId);
  });
  window.addEventListener('resize', resizeWorld);
  applyTransform();
  requestAnimationFrame(() => { resizeWorld(); fit(); });
})();
</script>
</body>
</html>
